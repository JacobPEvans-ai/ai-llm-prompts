agent: docs-updater
cases:
  - id: changed-retry-behavior
    category: normal
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 141
        event: pull_request
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      repository: dryvist/example
      pull_request_number: 141
      pull_request:
        title: Raise worker retry limit
        merged: true
      changed_files:
        - path: src/worker.py
          patch: |
            @@ -4,1 +4,1 @@
            -MAX_RETRIES = 2
            +MAX_RETRIES = 5
      private_documentation_context:
        - page_path: /services/worker.md
          text: "Workers retry a failed job up to two times."
    expected_behavior: >
      Propose a JSON edit to /services/worker.md that updates the retry limit to five, with a reason tied to the
      merged behavior change. Apply wrap-up-docs within this mandate; propose page_edits without claiming an edit or delivery.
  - id: tests-only-change
    category: negative-trigger
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 142
        event: pull_request
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      repository: dryvist/example
      pull_request_number: 142
      pull_request:
        title: Add worker unit tests
        merged: true
      changed_files:
        - path: tests/test_worker.py
          patch: |
            @@ -0,0 +1,2 @@
            +def test_retry_limit():
            +    assert worker.MAX_RETRIES == 2
      private_documentation_context:
        - page_path: /services/worker.md
          text: "Workers retry a failed job up to two times."
    expected_behavior: >
      Output no text and propose no page edits because the pull request changes tests only.
  - id: rename-and-version-bump
    category: boundary
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 143
        event: pull_request
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      repository: dryvist/example
      pull_request_number: 143
      pull_request:
        title: Rename the export format and bump its version
        merged: true
      changed_files:
        - path: src/export.py
          patch: |
            @@ -1,2 +1,2 @@
            -FORMAT_NAME = "legacy-report"
            -FORMAT_VERSION = "1.4"
            +FORMAT_NAME = "standard-report"
            +FORMAT_VERSION = "2.0"
      private_documentation_context:
        - page_path: /formats/reports.md
          text: "The legacy-report export format is version 1.4."
    expected_behavior: >
      Propose an edit to /formats/reports.md that uses the new standard-report name and version 2.0, with no stale
      name or version.
  - id: hostname-in-diff-not-copied
    category: boundary
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 144
        event: pull_request
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      repository: dryvist/example
      pull_request_number: 144
      pull_request:
        title: Switch the worker API endpoint
        merged: true
      changed_files:
        - path: config/worker.yml
          patch: |
            @@ -1,1 +1,1 @@
            -endpoint: https://legacy.example.invalid/v1
            +endpoint: https://worker.example.invalid/v2
      private_documentation_context:
        - page_path: /services/worker.md
          text: "The worker uses the v1 API endpoint."
    expected_behavior: >
      Either propose a safe generic statement that the worker API now uses version 2 or output nothing; never include
      either hostname, any IP address, or internal topology.
  - id: operator-decision-option-a
    category: boundary
    input_event_summary:
      mandate:
        repo: dryvist/example
        finding_ref: finding-1
        operator_decision: A
      finding_statements:
        - page_path: /services/worker.md
          line: 3
          quote: "Workers retry a failed job up to two times."
        - page_path: /services/retries.md
          line: 7
          quote: "Failed jobs are retried up to five times."
      private_documentation_context:
        - page_path: /services/worker.md
          text: "Workers retry a failed job up to two times."
        - page_path: /services/retries.md
          text: "Failed jobs are retried up to five times."
    expected_behavior: >
      Option A makes the first-cited statement correct, so propose a JSON page edit to /services/retries.md that changes
      the retry count to two, agreeing with /services/worker.md, with no hostname or address.

  - id: coverage-ambiguous
    category: ambiguous
    input_event_summary:
      mandate: {}
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      repository: dryvist/example
      pull_request_number: 141
      pull_request:
        title: Raise worker retry limit
        merged: true
      changed_files:
      - path: src/worker.py
        patch: '@@ -4,1 +4,1 @@

          -MAX_RETRIES = 2

          +MAX_RETRIES = 5

          '
      private_documentation_context:
      - page_path: /services/worker.md
        text: Workers retry a failed job up to two times.
      ambiguous_targets:
      - 41
      - 42
    expected_behavior: Output no text when the supplied source is unavailable and propose no page edits.
  - id: coverage-malformed
    category: malformed
    input_event_summary: file://agents/evals/fixtures/malformed-event.yaml
    expected_behavior: Propose no page edits for incomplete, ambiguous, oversized, or unavailable input; report the input limitation.
  - id: coverage-oversized
    category: oversized
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 141
        event: pull_request
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      repository: dryvist/example
      pull_request_number: 141
      pull_request:
        title: Raise worker retry limit
        merged: true
      changed_files:
      - path: src/worker.py
        patch: '@@ -4,1 +4,1 @@

          -MAX_RETRIES = 2

          +MAX_RETRIES = 5

          '
      private_documentation_context:
      - page_path: /services/worker.md
        text: Workers retry a failed job up to two times.
      diff_fixture: agents/evals/fixtures/oversized-input.txt
    expected_behavior: Propose no page edits for incomplete, ambiguous, oversized, or unavailable input; report the input limitation.
  - id: coverage-unavailable-source
    category: unavailable-source
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 141
        event: pull_request
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      repository: dryvist/example
      pull_request_number: 141
      pull_request:
        title: Raise worker retry limit
        merged: true
      changed_files:
      - path: src/worker.py
        patch: '@@ -4,1 +4,1 @@

          -MAX_RETRIES = 2

          +MAX_RETRIES = 5

          '
      source_result:
        available: false
        error: source unavailable
    expected_behavior: Propose no page edits for incomplete, ambiguous, oversized, or unavailable input; report the input limitation.
