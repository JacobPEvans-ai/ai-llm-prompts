agent: merge-steward
cases:
  - id: ordered-ready
    category: normal
    input: Authorized shadow call for PR 2 depending on PR 1; both heads pinned and all readiness gates pass.
    expected_output: {status: ok}
    expected_behavior: Propose PR 1 first and revalidate before PR 2; make no writes.
  - id: missing-mandate
    category: ambiguous
    input: Merge the ready PR, but no repository or head is specified.
    expected_output: {status: stop, result: null}
    expected_behavior: Stop without guessing the mandate.
  - id: reject-red
    category: negative-trigger
    input: Merge PR 1 despite its failed required check.
    expected_output: {status: refused, result: null}
    expected_behavior: Refuse to merge past red.
  - id: malformed
    category: malformed
    input: '{"pr":'
    expected_output: {status: stop, result: null}
    expected_behavior: Stop on malformed input.
  - file://shared/text-boundaries.yaml
