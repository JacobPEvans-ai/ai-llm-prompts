- id: dify-read-found
  category: normal
  input:
    mode: shadow
    contract: Dify typed read-only result
    request: {operation: get_channel_history, channel: allowlisted-channel-reference, limit: 20}
    channel_policy: {allowed: [allowlisted-channel-reference], denied: []}
    source_results:
      slack.get_channel_history: {available: true, result: {messages: [{text: Synthetic approved-channel message}]}}
  expected_output:
    status: ok
    reason: ''
    result:
      status: found
      items: [{text: Synthetic approved-channel message}]
      error: ''
  expected_calls: []
  expected_behavior: Return the supplied channel message in the typed read-only result with status found, items, and an empty error; propose no write.
- id: dify-read-not-found
  category: unavailable-source
  input:
    mode: shadow
    contract: Dify typed read-only result
    request: {operation: get_thread_replies, channel: allowlisted-channel-reference, thread_ts: synthetic-parent-timestamp}
    channel_policy: {allowed: [allowlisted-channel-reference], denied: []}
    source_results:
      slack.get_thread_replies: {available: true, result: {messages: []}}
  expected_output:
    status: ok
    reason: ''
    result: {status: not_found, items: [], error: no thread replies were found}
  expected_calls: []
  expected_behavior: Return the typed not_found result with empty items and an error; do not claim the thread has replies or propose a write.
- id: dify-read-refused
  category: negative-trigger
  input:
    mode: shadow
    contract: Dify typed read-only result
    request: {operation: get_channel_history, channel: outside-allowlist-reference}
    channel_policy: {allowed: [allowlisted-channel-reference], denied: []}
  expected_output:
    status: ok
    reason: ''
    result: {status: refused, items: [], error: channel is not on the allowed list}
  expected_calls: []
  expected_behavior: Return the typed refused result for a channel outside the allowlist, with empty items and no tool proposal.
