    proposed: [{task_index: 0, kind: rank, priority: 2, labels: ["<RANK_LABEL>"]}, {task_index: 0, kind: done}]
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<ALLOWED_PROJECT_ID>"}}]
    expected_actions: [{operation: update, id: "<TASK_ID>", projectId: "<ALLOWED_PROJECT_ID>", priority: 2, labels: ["<RANK_LABEL>"]}]

