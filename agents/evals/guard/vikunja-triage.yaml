    expected_actions: [{operation: update, id: "<TASK_ID>", projectId: "<ALLOWED_PROJECT_ID>", done: true}]

  - id: open-pr-is-not-done
    policy: {allowed: ["<ALLOWED_PROJECT_ID>"], readonly: [], rank_only: [], denied: []}
    tasks: [{id: "<TASK_ID>", project_id: "<ALLOWED_PROJECT_ID>", title: "<TASK_TITLE>", description: "Linked work: https://<GITHUB_WEB_HOST>/<OWNER>/<REPO>/pull/<N>"}]
    linked_work: {url: "https://<GITHUB_WEB_HOST>/<OWNER>/<REPO>/pull/<N>", state: open}
    proposed: [{task_index: 0, kind: done}]
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<ALLOWED_PROJECT_ID>"}}, {tool: github_reader, operation: read_public_state, args: {url: "https://<GITHUB_WEB_HOST>/<OWNER>/<REPO>/pull/<N>"}}]
    expected_actions: []

