    proposed: [{task_index: 0, kind: done}]
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<ALLOWED_PROJECT_ID>"}}]
    expected_actions: []

  - id: readonly-project-refuses-write
    policy: {allowed: [], readonly: ["<READONLY_PROJECT_ID>"], rank_only: [], denied: []}
    tasks: [{id: "<TASK_ID>", project_id: "<READONLY_PROJECT_ID>", title: "<TASK_TITLE>"}]
    proposed: [{task_index: 0, kind: rank, priority: 3, labels: ["<RANK_LABEL>"]}]
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<READONLY_PROJECT_ID>"}}]
    expected_actions: []

  - id: rank-only-project-limits-fields
    policy: {allowed: ["<RANK_ONLY_PROJECT_ID>"], readonly: [], rank_only: ["<RANK_ONLY_PROJECT_ID>"], denied: []}
    tasks: [{id: "<TASK_ID>", project_id: "<RANK_ONLY_PROJECT_ID>", title: "<TASK_TITLE>"}]
    proposed: [{task_index: 0, kind: rank, priority: 3, labels: ["<RANK_LABEL>"]}, {task_index: 0, kind: comment}, {task_index: 0, kind: done}]
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<RANK_ONLY_PROJECT_ID>"}}]
    expected_actions: [{operation: update, id: "<TASK_ID>", projectId: "<RANK_ONLY_PROJECT_ID>", priority: 3, labels: ["<RANK_LABEL>"]}]

  - id: denied-project-is-never-read
    policy: {allowed: ["<DENIED_PROJECT_ID>"], readonly: [], rank_only: [], denied: ["<DENIED_PROJECT_ID>"]}
    expected_calls: []
    expected_actions: []

  - id: incident-gets-only-zammad-comment
    policy: {allowed: ["<ALLOWED_PROJECT_ID>"], readonly: [], rank_only: [], denied: []}
    tasks: [{id: "<TASK_ID>", project_id: "<ALLOWED_PROJECT_ID>", title: "Service outage follow-up", description: "An outage was reported."}]
    proposed: [{task_index: 0, kind: rank, priority: 3, labels: ["<RANK_LABEL>"]}, {task_index: 0, kind: done}]
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<ALLOWED_PROJECT_ID>"}}]
    expected_actions: [{operation: comment, id: "<TASK_ID>", projectId: "<ALLOWED_PROJECT_ID>", comment: "This item belongs in Zammad."}]

  - id: task-text-injection-is-untrusted
