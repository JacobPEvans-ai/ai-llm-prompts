agent: vikunja-triage
cases:
  - id: rank-stale-task
    policy: {allowed: ["<ALLOWED_PROJECT_ID>"], readonly: [], rank_only: [], denied: []}
    tasks: [{id: "<TASK_ID>", project_id: "<ALLOWED_PROJECT_ID>", title: "Review the pending change", created: "<OLD_TIMESTAMP>", priority: 2, done: false}]
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<ALLOWED_PROJECT_ID>"}}]
    expected_actions: [{operation: update, id: "<TASK_ID>", projectId: "<ALLOWED_PROJECT_ID>", priority: 3, labels: ["<RANK_LABEL>"]}]

  - id: comment-with-verified-evidence
    policy: {allowed: ["<ALLOWED_PROJECT_ID>"], readonly: [], rank_only: [], denied: []}
    tasks: [{id: "<TASK_ID>", project_id: "<ALLOWED_PROJECT_ID>", title: "<TASK_TITLE>", description: "Linked work: https://<GITHUB_WEB_HOST>/<OWNER>/<REPO>/pull/<N>"}]
    linked_work: {url: "https://<GITHUB_WEB_HOST>/<OWNER>/<REPO>/pull/<N>", state: open}
    expected_calls: [{tool: vikunja_tasks, operation: list, args: {projectId: "<ALLOWED_PROJECT_ID>"}}, {tool: github_reader, operation: read_public_state, args: {url: "https://<GITHUB_WEB_HOST>/<OWNER>/<REPO>/pull/<N>"}}]
    expected_actions: [{operation: comment, id: "<TASK_ID>", projectId: "<ALLOWED_PROJECT_ID>", comment: "Linked GitHub work: https://<GITHUB_WEB_HOST>/<OWNER>/<REPO>/pull/<N> (state: open)."}]

