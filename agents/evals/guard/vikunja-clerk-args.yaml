# Code-guard fixtures for the clerk's first Code guard node: the intent that the model emits and the calls the guard builds.
# The model suite scores only the intent keys. These cases show what the guard, not the model, produces.
# Keys: intent is what the guard receives. mandates (project_id, task_id) and context (mode, allowed_projects,
# denied_projects, inbox, allowed_projects_raw) override the model suite's values when set.
# refusal is a fragment of the reason a refused case must return. offends lists the input paths that cause the refusal.
# Each refusal has a "<id>-control" case that changes only its offends paths and must pass.
# Scope, policy and update cases are in vikunja-clerk-args-scope.yaml.
cases:
  - id: list-open-tasks
    intent: {route: vikunja, operation: list, project_named: false, done: false, category: null}
    expected_tool_calls:
      - tool: vikunja_tasks
        operation: list
        args: {done: false}
  - id: summarize-one-task
    intent: {route: vikunja, operation: get, project_named: false, task_id: task-example-a, category: null}
    expected_tool_calls:
      - tool: vikunja_tasks
        operation: get
        args: {id: task-example-a}
  - id: create-task-in-allowed-project
    intent: {route: vikunja, operation: create, project_named: true, title: Update the onboarding guide, category: null}
    expected_tool_calls:
