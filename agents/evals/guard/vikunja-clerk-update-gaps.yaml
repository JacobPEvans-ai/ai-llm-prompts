    mandates: {project_id: project-unknown, task_id: task-example-a}
    task_result: {tool: vikunja_tasks, operation: get, args: {id: task-example-a}, task: {id: task-example-a, projectId: project-allowed, title: Update the onboarding guide, done: false}}
    refusal: The requested project is unknown or outside the allowed policy
    offends: [mandates.project_id]
    expected_tool_calls: []
  - id: refuse-requested-project-not-allowed-control
    intent: {route: vikunja, operation: update, project_named: false, description: Add the current onboarding steps., category: null}
    mandates: {project_id: project-allowed, task_id: task-example-a}
    task_result: {tool: vikunja_tasks, operation: get, args: {id: task-example-a}, task: {id: task-example-a, projectId: project-allowed, title: Update the onboarding guide, done: false}}
