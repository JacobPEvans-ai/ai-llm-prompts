# Code-guard fixtures for the Update project guard node: the remaining refusal rules (project scope, policies, priority and done types, current and requested projects).
# Same keys and rules as vikunja-clerk-update.yaml. Each refusal has a "<id>-control" case.
cases:
  - id: refuse-current-project-not-allowed
    intent: {route: vikunja, operation: update, project_named: false, description: Add the current onboarding steps., category: null}
    mandates: {project_id: "", task_id: task-example-a}
    task_result: {tool: vikunja_tasks, operation: get, args: {id: task-example-a}, task: {id: task-example-a, projectId: project-unknown, title: Update the onboarding guide, done: false}}
    refusal: The current task project is unknown or outside the allowed policy
    offends: [task_result.task.projectId]
    expected_tool_calls: []
  - id: refuse-current-project-not-allowed-control
    intent: {route: vikunja, operation: update, project_named: false, description: Add the current onboarding steps., category: null}
    mandates: {project_id: "", task_id: task-example-a}
    task_result: {tool: vikunja_tasks, operation: get, args: {id: task-example-a}, task: {id: task-example-a, projectId: project-allowed, title: Update the onboarding guide, done: false}}
    expected_tool_calls:
      - tool: vikunja_tasks
        operation: update
        args: {id: task-example-a, projectId: project-allowed, description: Add the current onboarding steps.}
  - id: refuse-requested-project-denied
    intent: {route: vikunja, operation: update, project_named: false, description: Add the current onboarding steps., category: null}
    mandates: {project_id: project-denied, task_id: task-example-a}
    context: {allowed_projects: [project-allowed, project-denied], denied_projects: [project-denied]}
    task_result: {tool: vikunja_tasks, operation: get, args: {id: task-example-a}, task: {id: task-example-a, projectId: project-allowed, title: Update the onboarding guide, done: false}}
    refusal: The requested project is denied
    offends: [mandates.project_id]
    expected_tool_calls: []
  - id: refuse-requested-project-denied-control
    intent: {route: vikunja, operation: update, project_named: false, description: Add the current onboarding steps., category: null}
    mandates: {project_id: project-allowed, task_id: task-example-a}
    context: {allowed_projects: [project-allowed, project-denied], denied_projects: [project-denied]}
    task_result: {tool: vikunja_tasks, operation: get, args: {id: task-example-a}, task: {id: task-example-a, projectId: project-allowed, title: Update the onboarding guide, done: false}}
    expected_tool_calls:
      - tool: vikunja_tasks
        operation: update
        args: {id: task-example-a, projectId: project-allowed, description: Add the current onboarding steps.}
  - id: refuse-requested-project-not-allowed
