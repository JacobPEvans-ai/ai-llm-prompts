    context: {allowed_projects: [project-allowed, project-denied], denied_projects: [project-denied]}
    expected_tool_calls:
      - tool: vikunja_tasks
        operation: get
        args: {id: task-example-a}
  - id: update-requested-not-allowed
    intent: {route: vikunja, operation: update, project_named: false, description: Add the current onboarding steps., category: null}
    mandates: {project_id: project-unknown, task_id: task-example-a}
