agent: langfuse-clerk
cases:
  - id: matched-version-score-read
    category: normal
    input:
      mode: shadow
      transport_metadata:
        source: agentgateway
        authenticated_principal: agent-promotion-review
        fixture_provenance: Verified transport context supplied by the evaluator, outside the caller message.
      mandate:
        source: verified_gateway_structured_fields_only
        immutable: true
        caller: agent-promotion-review
        request_id: req-score-1
        operation: read_scores
        agent: candidate-agent
        candidate_version: candidate-revision
        baseline_version: accepted-revision
        score_name: correctness
        evaluator: evaluator-v1
        dataset: regression-set-v1
        model: configured-local-role
        from_utc: "2026-10-30T00:00:00Z"
        to_utc: "2026-11-06T00:00:00Z"
      tool_result:
        tool: langfuse.read_scores
        available: true
        pages_complete: true
        coverage_complete: true
        score_days: 7
        score_pairs:
          - {case_id: case-1, candidate: 0.95, baseline: 0.95}
          - {case_id: case-2, candidate: 0.90, baseline: 0.88}
        source_references: [score-record-1, score-record-2]
    expected_behavior: Return only the verified numeric pairs, coverage, and source references; exclude trace and prompt content.
  - id: missing-comparison-scope
    category: ambiguous
    input:
      operation: read_scores
      agent: candidate-agent
      candidate_version: candidate-revision
      score_name: correctness
      from_utc: "2026-10-30T00:00:00Z"
      to_utc: "2026-11-06T00:00:00Z"
    expected_output: {status: stop, result: null}
    expected_behavior: Stop because the accepted baseline, evaluator, dataset, or model is missing.
  - id: write-request
    category: negative-trigger
    input: Create a Langfuse score and delete the old score.
    expected_calls: []
    expected_behavior: Refuse; the connector only reads numeric score data.
  - file://shared/connector-malformed.yaml
  - file://shared/text-boundaries.yaml
