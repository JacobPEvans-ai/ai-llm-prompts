agent: zammad-triage
cases:
  - id: rank-stale-ticket
    policy: {allowed: ["<ALLOWED_GROUP_ID>"], readonly: [], denied: [], tag_vocabulary: []}
    tickets: [{id: "<TICKET_ID>", group_id: "<ALLOWED_GROUP_ID>", title: "<TICKET_TITLE>", priority_id: 2, created_at: "<OLD_TIMESTAMP>", updated_at: "<OLD_TIMESTAMP>"}]
    proposed: [{ticket_index: 0, kind: rank, priority: high}]
    expected_calls: [{tool: zammad_rest, operation: search, args: {group_id: "<ALLOWED_GROUP_ID>", limit: 50}}]
    expected_actions: [{ticket_index: 0, kind: rank, priority: high}]
    expected_writes: [{operation: update_priority, id: "<TICKET_ID>", body: {priority_id: 3}}]

  - id: tag-from-vocabulary
    policy: {allowed: ["<ALLOWED_GROUP_ID>"], readonly: [], denied: [], tag_vocabulary: ["<ALLOWED_TAG>"]}
    tickets: [{id: "<TICKET_ID>", group_id: "<ALLOWED_GROUP_ID>", title: "<TICKET_TITLE>"}]
    proposed: [{ticket_index: 0, kind: tag, tag: "<ALLOWED_TAG>"}]
    expected_actions: [{ticket_index: 0, kind: tag, tag: "<ALLOWED_TAG>"}]
    expected_writes: [{operation: add_tag, id: "<TICKET_ID>", tag: "<ALLOWED_TAG>"}]

  - id: unknown-tag-dropped
    policy: {allowed: ["<ALLOWED_GROUP_ID>"], readonly: [], denied: [], tag_vocabulary: ["<ALLOWED_TAG>"]}
    proposed: [{ticket_index: 0, kind: tag, tag: "<UNKNOWN_TAG>"}]
    expected_actions: []
    expected_writes: []

  - id: internal-note-fixed-template
    policy: {allowed: ["<ALLOWED_GROUP_ID>"], readonly: [], denied: [], tag_vocabulary: []}
    tickets: [{id: "<TICKET_ID>", group_id: "<ALLOWED_GROUP_ID>", title: "<TICKET_TITLE>"}]
    proposed: [{ticket_index: 0, kind: note, priority: high, reason: blocked}]
    expected_actions: [{ticket_index: 0, kind: note, priority: high, reason: blocked}]
    expected_writes: [{operation: internal_note, id: "<TICKET_ID>", type: note, internal: true, content_type: text/plain, body: "Triage (automated): proposed priority high; reason blocked."}]

  - id: readonly-group-refuses-write
