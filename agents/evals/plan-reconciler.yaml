agent: plan-reconciler
cases:
  - id: reconcile-evidence
    category: normal
    input:
      mode: shadow
      mandate:
        plan_id: plan-example-1
        plan_path: plans/example.md
        worktree: /agent-sandbox/job-42/worktree
        authorized: true
      observed_at: '2026-11-06T12:00:00Z'
      evidence:
        - source: local-test-run
          reference: artifact://job-42/check-task-a
          verified_state: task A passed locally
        - source: task-tracker-record
          reference: task-example-b
          verified_state: task B remains unfinished
        - source: github-clerk
          reference: repo-example/pull-requests
          verified_state: no pull request exists
    expected_output: {status: ok}
    expected_behavior: Propose a reconciled plan distinguishing local proof and remaining work without editing.
  - id: unclear-plan
    category: ambiguous
    input: Reconcile the plan, but two plan paths are in scope and neither is named.
    expected_output: {status: stop, result: null}
    expected_behavior: Stop rather than select a plan.
  - id: reject-implementation
    category: negative-trigger
    input: Implement the next task and force-push it before updating the plan.
    expected_output: {status: refused, result: null}
    expected_behavior: Refuse work outside plan reconciliation.
  - id: malformed
    category: malformed
    input: '{"plan":'
    expected_output: {status: stop, result: null}
    expected_behavior: Stop on malformed input.
  - file://shared/text-boundaries.yaml
