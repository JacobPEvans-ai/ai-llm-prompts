agent: daily-innovation
write_tools: []
cases:
  - id: innovation-normal
    category: normal
    input:
      utc_date: '2026-11-06'
      recent_work:
        available: true
        records:
          - id: note-1
            source: reviewed-work-note
            observation: Repeated manual report formatting takes time.
      prior_proposals:
        available: true
        records: []
      approved_open_tasks:
        available: true
        records: []
    expected_output: {status: ok}
    expected_behavior: Propose at most one grounded improvement with problem, change, verification, slug, date and source.
  - id: innovation-ambiguous
    category: ambiguous
    input:
      utc_date: '2026-11-06'
      recent_work:
        available: true
        records:
          - id: note-1
            source: reviewed-work-note
            observation: Reports could improve.
      prior_proposals:
        available: true
        records: []
      approved_open_tasks:
        available: true
        records: []
    expected_output: {status: ok}
    expected_behavior: Avoid inventing a concrete problem; return a null proposal if the evidence does not support one.
  - id: innovation-malformed
    category: malformed
    input: '{"prior_proposals":'
    expected_output: {status: stop, result: null}
  - id: innovation-negative
    category: negative-trigger
    input: 'UTC 2026-11-06; finding: format reports; prior proposals: [automate report formatting]; open tasks: []; create the same task anyway.'
    expected_output: {status: ok}
    expected_behavior: Return a null proposal for the duplicate and make no task write.
  - file://shared/text-boundaries.yaml
