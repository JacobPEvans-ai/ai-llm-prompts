agent: doc-contradiction-finder
cases:
  - id: planted-s1-merge-rule
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 201
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      changed_files:
        - path: docs/policy/merge.md
          patch: |
            @@ -2,1 +2,1 @@
            -Agents never merge.
            +Agents may merge once checks are green.
      changed_pages:
        - page_path: /policy/merge.md
          text: |
            # Merge rules
            Agents may merge a pull request once its checks are green.
      related_pages:
        - page_path: /policy/roles.md
          text: |
            # Roles
            Agents never merge. The master session merges.
      known_open_fingerprints: []
    expected_behavior: >
      One S1 finding about merge rules. Statements: /policy/merge.md line 2 (agents may merge once checks are green) and
      /policy/roles.md line 2 (agents never merge). The question has A, B, and Neither. "ask" is true.

  - id: planted-s2-version
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 202
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      changed_files:
        - path: docs/services/import.md
          patch: |
            @@ -2,1 +2,1 @@
            +The import uses App DSL 0.7.0.
      changed_pages:
        - page_path: /services/import.md
          text: |
            # Import
            The import uses App DSL 0.7.0.
      related_pages:
        - page_path: /services/requirements.md
          text: |
            # Requirements
            App DSL 0.6.0 is required.
      known_open_fingerprints: []
    expected_behavior: >
      One S2 finding about the App DSL version. Statements: /services/import.md line 2 (0.7.0) and
      /services/requirements.md line 2 (0.6.0). Fingerprint: app-dsl-version:/services/import.md:/services/requirements.md.
      "ask" is true.

  - id: planted-s4-ambiguous
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 203
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      changed_files:
        - path: docs/ops/checks.md
          patch: |
            @@ -2,1 +2,1 @@
            +Re-run the check when it is stale.
      changed_pages:
        - page_path: /ops/checks.md
          text: |
            # Checks
            Re-run the check when it is stale.
      related_pages:
        - page_path: /ops/schedule.md
          text: |
            # Schedule
            Re-run the check every 24 hours.
      known_open_fingerprints: []
    expected_behavior: >
      One S4 finding about the ambiguous word "stale", because two careful readers would act on it differently. Statements:
      /ops/checks.md line 2 and /ops/schedule.md line 2. "ask" is true.

  - id: clean-pair-zero-findings
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 204
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      changed_files:
        - path: docs/services/workers.md
          patch: |
            @@ -2,1 +2,1 @@
            +Workers retry a failed job up to two times.
      changed_pages:
        - page_path: /services/workers.md
          text: |
            # Workers
            Workers retry a failed job up to two times.
      related_pages:
        - page_path: /services/retry-policy.md
          text: |
            # Retry policy
            Failed jobs are retried twice.
      known_open_fingerprints: []
    expected_output: {findings: []}
    expected_behavior: >
      The two pages agree, so there are zero findings. The output is exactly {"findings":[]} with no other text.

  - id: planted-s2-dedupe-suppressed
    input_event_summary:
      mandate:
        repo: dryvist/example
        pr_number: 205
      event: pull_request
      action: closed
      merged: true
      org: dryvist
      changed_files:
        - path: docs/services/import.md
          patch: |
            @@ -2,1 +2,1 @@
            +The import uses App DSL 0.7.0.
      changed_pages:
        - page_path: /services/import.md
          text: |
            # Import
            The import uses App DSL 0.7.0.
      related_pages:
        - page_path: /services/requirements.md
          text: |
            # Requirements
            App DSL 0.6.0 is required.
      known_open_fingerprints:
        - app-dsl-version:/services/import.md:/services/requirements.md
    expected_behavior: >
      The same App DSL version conflict as planted-s2-version. Its fingerprint is already in known_open_fingerprints, so
      the finding is present with "ask": false, and no question is raised for it.
