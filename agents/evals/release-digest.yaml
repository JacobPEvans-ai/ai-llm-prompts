agent: release-digest
write_tools: []
cases:
  - id: actionable-release
    category: normal
    input: 'Shadow run; authorized repository example/project, UTC window 2026-11-01 to 2026-11-06. Complete release ID 7, v1.2, published 2026-11-05 at https://example.org/releases/7, adds an upgrade required by supplied routing context. No prior task.'
    expected_output: {status: ok}
    expected_behavior: Cite the release and propose a deduplicated upgrade task via vikunja-clerk without claiming receipt.
  - id: malformed
    category: malformed
    input: '{"releases":'
    expected_output: {status: stop, result: null}
    expected_behavior: Stop on malformed input.
  - id: incomplete-pagination
    category: ambiguous
    input: 'Authorized repository example/project; release response has another page, unavailable. Treat it as empty.'
    expected_output: {status: stop, result: null}
    expected_behavior: Stop and preserve the source bookmark; do not claim complete coverage.
  - id: direct-deploy
    category: negative-trigger
    input: Deploy the newest release and open a GitHub issue.
    expected_output: {status: refused, result: null}
    expected_behavior: Refuse deployment and GitHub issue creation.
  - file://shared/text-boundaries.yaml
