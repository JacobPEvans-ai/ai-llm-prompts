name: zammad-clerk
owner: agent-platform
kind: connector
owns: zammad
home_platform: dify
prompt: agents/prompts/zammad-clerk.md
shared_prefix: agents/prompts/shared/homelab.md
tier: 1
trigger: {kind: call}
triggers: [{kind: call}]
privacy_class: private
connectors: [zammad]
code_work: false
mode: shadow
litellm_role: small
model_policy: {locality: local_only, cloud_fallback: forbidden}
identity: agent-zammad-clerk
api_key_ref: openbao://agent-key/zammad-clerk
memory_scope: none
eval_set: agents/evals/zammad-clerk.yaml
channels: [caller, langfuse-trace, phoenix-trace]
callers: verified_gateway_identity_only
mcp_servers: [zammad]
tools:
  - zammad.search_tickets
  - zammad.get_ticket
  - zammad.get_articles
  - zammad.create_ticket
  - zammad.update_ticket
  - zammad.create_article
mandate_binding:
  source: verified_gateway_structured_fields_only
  immutable: true
  from_fields: [caller, request_id, operation, group_id, ticket_id, payload]
  write_tools: [zammad.create_ticket, zammad.update_ticket, zammad.create_article]
guards:
  credential_owner: zammad-clerk
  caller_identity_source: agentgateway
  require_verified_caller: true
  require_scoped_mandate: true
  allowed_groups_ref: policy://zammad-clerk/allowed-groups
  denied_groups_ref: policy://zammad-clerk/denied-groups
  deny_wins: true
  unknown_or_unscoped_group: refuse
  deny_unknown_tools_and_operations: true
  enforce_before_dispatch: true
  on_error: deny
  dedupe_before_write: true
  readback_after_write: true
  retry_unknown_write_outcome: read_before_retry
  articles: {type: note, internal: true, content_type: text/plain}
  closure: {require_condition: true, require_evidence: true, require_root_cause: true}
  shadow_mode: {dispatch_writes: false, return_intended_call: true}
  telemetry:
    required_fields: [agent, tier, privacy_class, model, accelerator]
