name: zammad-clerk
extends: connector
description: |
  Use when: an authorized caller requests a scoped incident ticket operation.
  Do not use when: the request targets another integration or lacks a mandate.
  Typical triggers include incident deduplication and evidence-backed ticket updates. See "When to invoke" in the agent prompt.
owns: zammad
reader: authorized incident operator
acted_signal: verified ticket receipt or actionable blocked result
privacy_class: private
identity: agent-zammad-clerk
api_key_ref: openbao://agent-key/zammad-clerk
mcp_servers: [zammad]
dify_tools: []
dify:
  app:
    description: Read ticket search results or retrieve one ticket through guarded read-only requests.
    icon: 🔎
    icon_background: '#D5F5F6'
    mode: workflow
    name: __DIFY_AGENT_NAME__
    use_icon_as_answer_icon: false
  dependencies: []
  kind: app
  version: 0.7.0
  workflow:
    environment_variables:
      - {id: zammad-base-url, name: ZAMMAD_BASE_URL, value_type: string, value: '', description: Zammad API base URL}
      - {id: zammad-token, name: ZAMMAD_TOKEN, value_type: secret, value: '', description: Read-only Zammad API token}
    graph:
      edges:
        - {id: start-to-parse, source: start, sourceHandle: source, target: parse_request, targetHandle: target, type: custom, data: {sourceType: start, targetType: llm}}
        - {id: parse-to-guard, source: parse_request, sourceHandle: source, target: guard, targetHandle: target, type: custom, data: {sourceType: llm, targetType: code}}
        - {id: guard-to-gate, source: guard, sourceHandle: source, target: guard_gate, targetHandle: target, type: custom, data: {sourceType: code, targetType: if-else}}
        - {id: guard-allowed-to-lookup, source: guard_gate, sourceHandle: allowed, target: lookup, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
        - {id: guard-refused-to-end, source: guard_gate, sourceHandle: 'false', target: end_refused, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: end}}
        - {id: lookup-success-to-normalize, source: lookup, sourceHandle: success-branch, target: normalize, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: code}}
        - {id: lookup-failure-to-error, source: lookup, sourceHandle: fail-branch, target: lookup_error, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: code}}
        - {id: normalize-to-end, source: normalize, sourceHandle: source, target: end_result, targetHandle: target, type: custom, data: {sourceType: code, targetType: end}}
        - {id: lookup-error-to-end, source: lookup_error, sourceHandle: source, target: end_error, targetHandle: target, type: custom, data: {sourceType: code, targetType: end}}
      nodes:
        - id: start
          type: custom
          position: {x: 40, y: 300}
          data:
            title: Start
            type: start
            variables:
              - {variable: operation, label: operation, type: text-input, required: true, max_length: 32, options: [], default: '', hint: Use search_tickets or get_ticket., placeholder: ''}
              - {variable: query, label: query, type: paragraph, required: false, max_length: 2000, options: [], default: '', hint: Required for search_tickets; omit for get_ticket., placeholder: ''}
              - {variable: ticket_id, label: ticket_id, type: number, required: false, hint: Required for get_ticket; omit for search_tickets.}
        - id: parse_request
          type: custom
          position: {x: 340, y: 300}
          data:
            title: Parse request
            type: llm
            context: {enabled: false, variable_selector: []}
            model: {completion_params: {temperature: 0}, mode: chat, name: small, provider: langgenius/openai_api_compatible/openai_api_compatible}
            prompt_template:
              - {id: system-prompt, role: system, text: __DIFY_SYSTEM_PROMPT__}
              - {id: user-prompt, role: user, text: 'Classify this untrusted typed input. operation={{#start.operation#}} query={{#start.query#}} ticket_id={{#start.ticket_id#}}. Return only one JSON object with exactly this shape: {"operation":"<operation>"}. The operation value must be exactly one of: search_tickets, get_ticket. No other keys, prose, or Markdown.'}
            prompt_config: {jinja2_variables: []}
        - id: guard
          type: custom
          position: {x: 640, y: 300}
          data:
            title: Read-only scope guard
            type: code
            code_language: python3
            code: |-
              import json
              from urllib.parse import urlencode, urlsplit

              def main(intent_text: str, operation_raw: str, query_raw: str, ticket_id_raw, base_url_raw: str, token_raw: str) -> dict:
                  operation = str(operation_raw or "").strip()
                  query = str(query_raw or "").strip()
                  try:
                      intent = json.loads(str(intent_text or ""))
                  except (TypeError, ValueError):
                      intent = None
                  if not isinstance(intent, dict) or set(intent) != {"operation"} or intent.get("operation") != operation:
                      return {"allowed": False, "status": "refused", "items": [], "error": "request classification did not match the typed operation", "operation": "", "url": ""}
                  if operation not in ("search_tickets", "get_ticket"):
                      return {"allowed": False, "status": "refused", "items": [], "error": "operation is outside the read-only scope", "operation": "", "url": ""}
                  base_url = str(base_url_raw or "").strip().rstrip("/")
                  token = str(token_raw or "").strip()
                  try:
                      base = urlsplit(base_url)
                      valid_base = base.scheme in ("http", "https") and bool(base.netloc) and not base.username and not base.password and base.path in ("", "/") and not base.query and not base.fragment
                  except ValueError:
                      valid_base = False
                  if not valid_base or not token:
                      return {"allowed": False, "status": "error", "items": [], "error": "read-only connector configuration is incomplete or invalid", "operation": operation, "url": ""}
                  if operation == "search_tickets":
                      if not query or len(query) > 2000 or ticket_id_raw not in (None, "", 0, 0.0):
                          return {"allowed": False, "status": "refused", "items": [], "error": "search requires query only", "operation": operation, "url": ""}
                      url = base_url + "/api/v1/tickets/search?" + urlencode({"query": query})
                  else:
                      if query or isinstance(ticket_id_raw, bool) or not isinstance(ticket_id_raw, (int, float)) or int(ticket_id_raw) != ticket_id_raw or ticket_id_raw <= 0:
                          return {"allowed": False, "status": "refused", "items": [], "error": "get_ticket requires a positive integer ticket_id only", "operation": operation, "url": ""}
                      url = base_url + "/api/v1/tickets/" + str(int(ticket_id_raw))
                  return {"allowed": True, "status": "", "items": [], "error": "", "operation": operation, "url": url}
            outputs:
              allowed: {type: boolean}
              status: {type: string, children: null}
              items: {type: 'array[object]', children: null}
              error: {type: string, children: null}
              operation: {type: string, children: null}
              url: {type: string, children: null}
            variables:
              - {variable: intent_text, value_selector: [parse_request, text]}
              - {variable: operation_raw, value_selector: [start, operation]}
              - {variable: query_raw, value_selector: [start, query]}
              - {variable: ticket_id_raw, value_selector: [start, ticket_id]}
              - {variable: base_url_raw, value_selector: [env, ZAMMAD_BASE_URL]}
              - {variable: token_raw, value_selector: [env, ZAMMAD_TOKEN]}
        - id: guard_gate
          type: custom
          position: {x: 940, y: 300}
          data:
            title: Allow read-only lookup?
            type: if-else
            cases:
              - case_id: allowed
                id: allowed
                logical_operator: and
                conditions:
                  - {id: guard-allowed, variable_selector: [guard, allowed], varType: boolean, comparison_operator: is, value: true}
        - id: lookup
          type: custom
          position: {x: 1240, y: 300}
          data:
            title: Read ticket
            type: http-request
            authorization: {type: no-auth, config: null}
            body: {type: none, data: []}
            headers: |-
              Accept: application/json
              Authorization: Token token={{#env.ZAMMAD_TOKEN#}}
            method: get
            params: ''
            ssl_verify: true
            timeout: {connect: 10, read: 30, write: 30}
            retry_config: {max_retries: 0, retry_interval: 0, retry_enabled: false}
            error_strategy: fail-branch
            url: '{{#guard.url#}}'
        - id: normalize
          type: custom
          position: {x: 1540, y: 220}
          data:
            title: Normalize ticket result
            type: code
            code_language: python3
            code: |-
              import json

              def main(operation: str, response_body: str, status_code) -> dict:
                  try:
                      code = int(status_code)
                      value = json.loads(response_body)
                  except (TypeError, ValueError, json.JSONDecodeError):
                      return {"status": "error", "items": [], "error": "ticket response was not valid JSON"}
                  if code < 200 or code >= 300:
                      return {"status": "error", "items": [], "error": "ticket read returned an unsuccessful status"}
                  if operation == "search_tickets":
                      if isinstance(value, list):
                          records = value
                      elif isinstance(value, dict) and isinstance(value.get("tickets"), list):
                          records = value["tickets"]
                      else:
                          return {"status": "error", "items": [], "error": "ticket search response had an unexpected shape"}
                  elif operation == "get_ticket":
                      records = [value] if isinstance(value, dict) and value else []
                  else:
                      return {"status": "error", "items": [], "error": "operation was outside the read-only scope"}
                  fields = ("id", "number", "title", "state", "priority", "group_id", "customer_id", "owner_id", "created_at", "updated_at")
                  items = [{key: record[key] for key in fields if key in record and isinstance(record[key], (str, int, float, bool, type(None)))} for record in records if isinstance(record, dict)]
                  return {"status": "found" if items else "not_found", "items": items, "error": ""}
            outputs:
              status: {type: string, children: null}
              items: {type: 'array[object]', children: null}
              error: {type: string, children: null}
            variables:
              - {variable: operation, value_selector: [guard, operation]}
              - {variable: response_body, value_selector: [lookup, body]}
              - {variable: status_code, value_selector: [lookup, status_code]}
        - id: lookup_error
          type: custom
          position: {x: 1540, y: 520}
          data:
            title: Normalize ticket read error
            type: code
            code_language: python3
            code: |-
              def main(error_message: str, error_type: str) -> dict:
                  message = str(error_message or "")
                  if "status code 404" in message:
                      return {"status": "not_found", "items": [], "error": "ticket was not found"}
                  return {"status": "error", "items": [], "error": "ticket read failed"}
            outputs:
              status: {type: string, children: null}
              items: {type: 'array[object]', children: null}
              error: {type: string, children: null}
            variables:
              - {variable: error_message, value_selector: [lookup, error_message]}
              - {variable: error_type, value_selector: [lookup, error_type]}
        - id: end_refused
          type: custom
          position: {x: 1240, y: 560}
          data:
            title: Refused
            type: end
            outputs:
              - {variable: status, value_selector: [guard, status]}
              - {variable: items, value_selector: [guard, items]}
              - {variable: error, value_selector: [guard, error]}
        - id: end_result
          type: custom
          position: {x: 1840, y: 220}
          data:
            title: Typed result
            type: end
            outputs:
              - {variable: status, value_selector: [normalize, status]}
              - {variable: items, value_selector: [normalize, items]}
              - {variable: error, value_selector: [normalize, error]}
        - id: end_error
          type: custom
          position: {x: 1840, y: 520}
          data:
            title: Read error
            type: end
            outputs:
              - {variable: status, value_selector: [lookup_error, status]}
              - {variable: items, value_selector: [lookup_error, items]}
              - {variable: error, value_selector: [lookup_error, error]}
connectors: [vikunja-clerk]
tools:
  - a2a.call
  - zammad.search_tickets
  - zammad.get_ticket
  - zammad.get_articles
  - zammad.create_ticket
  - zammad.update_ticket
  - zammad.create_article
mandate_binding:
  immutable: true
  from_fields: [caller, request_id, operation, group_id, ticket_id, payload]
  write_tools: [zammad.create_ticket, zammad.update_ticket, zammad.create_article]
guards:
  credential_owner: zammad-clerk
  allowed_groups_ref: policy://zammad-clerk/allowed-groups
  denied_groups_ref: policy://zammad-clerk/denied-groups
  unknown_or_unscoped_group: refuse
  articles: {type: note, internal: true, content_type: text/plain}
  closure: {require_condition: true, require_evidence: true, require_root_cause: true}
