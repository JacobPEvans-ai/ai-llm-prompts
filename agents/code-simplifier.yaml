name: code-simplifier
owner: agent-platform
home_platform: dify
prompt: agents/prompts/code-simplifier.md
shared_prefix: shared/homelab.md
tools:
  - github.pulls.get
  - github.pulls.diff
  - github.branches.get
  - github.repos.get_branch_rules
  - github.pulls.create_review
mcp_servers: []
privacy_class: public-code
litellm_role: medium
trigger:
  kind: event
  event_filter:
    event: pull_request
    action:
      - opened
      - ready_for_review
    org: dryvist
memory_scope: none
eval_set: agents/evals/code-simplifier.yaml
identity: agent-code-simplifier
api_key_ref: openbao://llm-router-agent-keys/code-simplifier
