name: code-simplifier
owner: agent-platform
home_platform: dify
shadows: [sim, langflow]
tier: 1
connectors: [github-clerk]
code_work: none
mode: shadow
# Credential model: per-agent LiteLLM key plus an AppRole that can mint only a
# short-lived GitHub App installation token for the event repo; Dify holds no
# PAT or App key.
prompt: agents/prompts/code-simplifier.md
shared_prefix: agents/prompts/shared/homelab.md
tools:
  - github.pulls.get
  - github.pulls.diff
  - github.branches.get
  - github.repos.get_branch_rules
  - github.pulls.create_review
mcp_servers: []
privacy_class: public
# LiteLLM router role, not a model ID.
litellm_role: medium
triggers:
  - kind: event
    source: github.pull_request
    skew_minutes: 0
    event_filter:
      event: pull_request
      action: [opened, ready_for_review]
      org: dryvist
mandate_binding:
  required_fields: [repo, pr_number]
  event: pull_request
channels:
  shadow: run_record_only
  live: github.review
memory_scope: none
eval_set: agents/evals/code-simplifier.yaml
promotion:
  after_matching_shadow_runs: 20
  against: agents/evals/code-simplifier.yaml # TBD-master
identity: agent-code-simplifier
secret_ref: agent-key/code-simplifier
github_token_ref: github-token/code-simplifier
guards:
  github.pulls.create_review:
    bound_to:
      repo: mandate.repo
      pr_number: mandate.pr_number
    repository_source: mandate.repo
    pull_request_number_source: mandate.pr_number
    event: COMMENT
    event_enforced_in_code: true
    max_reviews_per_event: 1
    eligibility:
      event: pull_request
      actions: [opened, ready_for_review]
      base_repository_owner: dryvist
      same_repository_only: true
      refuse_forks: true
      refuse_closed_pull_requests: true
    head_ref_source: trigger_payload
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_review: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    diff_limit:
      max_files: 40
      max_changed_lines: 6000
      enforce_before_review: true
    token_scope:
      permissions: ["pull_requests:write", "contents:read"]
      deny_permissions: ["contents:write"]
      repositories: [trigger_event_repository_only]
      max_lifetime: 1h
