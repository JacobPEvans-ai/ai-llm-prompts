name: docs-updater
owner: agent-platform
tier: 1
home_platform: dify
shadows: [sim, langflow]
mode: shadow
prompt: agents/prompts/docs-updater.md
shared_prefix: agents/prompts/shared/homelab.md
tools: [a2a.send_message]
mcp_servers: []
privacy_class: internal
# LiteLLM router role, not a model ID.
litellm_role: medium
triggers:
  - kind: event
    source: github.pull_request.closed
    cadence: merged
    skew_minutes: 0
  - kind: call
    source: session-lead
    cadence: on_demand
    skew_minutes: 0
connectors: [github-clerk]
code_work: none
procedure:
  - repo: dryvist/claude-code-plugins
    path: ai-cli-harness-better-practices/skills/wrap-up-docs/SKILL.md
mandate_binding:
  required_fields: [repo, pr_number]
  event: pull_request
  alternate_shapes:
    - required_fields: [repo, finding_ref, operator_decision]
      live: false
      decision_values: [A, B, neither]
    - required_fields: [repo, handoff_ref, documentation_targets]
channels:
  shadow: run_record_only
  live: documentation_handoff
memory_scope: none
eval_set: agents/evals/docs-updater.yaml
identity: agent-docs-updater
