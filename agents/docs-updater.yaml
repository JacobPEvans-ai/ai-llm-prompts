name: docs-updater
owner: agent-platform
home_platform: dify
shadows: [sim, langflow]
tier: 1
connectors: [github-clerk]
code_work: sandbox
mode: shadow
# Credential model: per-agent LiteLLM key plus an AppRole that can mint only a short-lived GitHub App installation token for the event repo.
prompt: agents/prompts/docs-updater.md
shared_prefix: agents/prompts/shared/homelab.md
tools:
  - github.pulls.get
  - github.pulls.diff
  - github.repos.get
mcp_servers: []
privacy_class: private
# LiteLLM router role, not a model ID.
litellm_role: medium
triggers:
  - kind: event
    source: github.pull_request
    skew_minutes: 0
    event_filter:
      event: pull_request
      action: [closed]
      merged: true
      org: dryvist
mandate_binding:
  required_fields: [repo, pr_number]
  event: pull_request
  alternate_shapes:
    - required_fields: [repo, finding_ref, operator_decision]
      live: false
      decision_values: [A, B, neither]
channels:
  shadow: run_record_only
  live: docs_private.pull_request # Requires a docs-private write grant, which agent-docs-updater lacks today; its GitHub set is read-only on public repos, so live stays off until the grant exists.
memory_scope: none
eval_set: agents/evals/docs-updater.yaml
identity: agent-docs-updater
secret_ref: agent-key/docs-updater
github_token_ref: github-token/docs-updater
