name: action-extractor
extends: interactive
description: |
  Use when: supplied text needs verbatim task extraction.
  Do not use when: the request needs general advice or invented tasks.
identity: agent-action-extractor
api_key_ref: openbao://agent-key/action-extractor
input: "Notes or conversation text. An optional section headed MY NOTES holds the caller's own notes."
# The Validate reply node also requires every action item quote to appear in the input.
output_schema:
  properties:
    result:
      anyOf:
        - {type: "null"}
        - type: object
          required: [summary, action_items]
          additionalProperties: false
          properties:
            summary: {type: array, minItems: 1, maxItems: 6, items: {type: string}}
            action_items:
              type: array
              items:
                type: object
                required: [owner, item, due, quote, from_my_notes]
                additionalProperties: false
                properties:
                  owner: {type: string}
                  item: {type: string}
                  due: {type: string}
                  quote: {type: string}
                  from_my_notes: {type: boolean}
dify:
  app: {description: Summarize notes or a conversation and extract its action items., mode: workflow, name: __DIFY_AGENT_NAME__}
  dependencies: []
  kind: app
  version: 0.7.0
  workflow:
    environment_variables: []
    graph:
      edges:
      - data: {sourceType: start, targetType: llm}
        id: e1
        source: start
        sourceHandle: source
        target: model
        targetHandle: target
        type: custom
      - data: {sourceType: llm, targetType: code}
        id: e2
        source: model
        sourceHandle: source
        target: validate
        targetHandle: target
        type: custom
      - data: {sourceType: code, targetType: end}
        id: e3
        source: validate
        sourceHandle: source
        target: done
        targetHandle: target
        type: custom
      nodes:
      - data:
          title: Start
          type: start
          variables:
          - variable: text
            label: text
            type: paragraph
            required: true
            max_length: 30000
            options: []
            hint: Notes or conversation text; an optional section headed MY NOTES wins over the rest
        id: start
        position: {x: 40, y: 300}
        type: custom
      - data:
          model:
            completion_params: {temperature: 0}
            mode: chat
            name: __DIFY_LITELLM_ROLE__
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
          - {id: system-prompt, role: system, text: __DIFY_SYSTEM_PROMPT__}
          - {id: user-prompt, role: user, text: 'Untrusted input: {{#start.text#}}'}
          prompt_config:
            jinja2_variables: []
          title: Extract actions
          context: {enabled: false, variable_selector: []}
          type: llm
        id: model
        position: {x: 340, y: 300}
        type: custom
      - data:
          code: |-
            import json
            __DIFY_HELPER_JSON_FENCE__
            __DIFY_HELPER_ENVELOPE__
            SCHEMA = json.loads(__DIFY_OUTPUT_SCHEMA__)
            def result_problem(result, text):
                source = " ".join(str(text).split())
                if any(" ".join(item["quote"].split()) not in source for item in result["action_items"]):
                    return "every reply.result.action_items quote must appear in the input"
                return None
            def main(reply: str, text: str) -> dict:
                if not str(text).strip():
                    envelope = {"status": "stop", "reason": "input is empty", "result": None}
                else:
                    parsed, problem = check_envelope(reply, SCHEMA)
                    if problem is None and parsed["status"] == "ok":
                        problem = result_problem(parsed["result"], text)
                    envelope = parsed if problem is None else {"status": "stop", "reason": problem, "result": None}
                return {"status": envelope["status"], "envelope": json.dumps(envelope, ensure_ascii=False)}
          code_language: python3
          outputs:
            status: {type: string}
            envelope: {type: string}
          title: Validate reply
          type: code
          variables:
          - variable: reply
            value_selector: [model, text]
          - variable: text
            value_selector: [start, text]
        id: validate
        position: {x: 640, y: 300}
        type: custom
      - data:
          outputs:
          - variable: status
            value_selector: [validate, status]
          - variable: envelope
            value_selector: [validate, envelope]
          title: End
          type: end
        id: done
        position: {x: 940, y: 300}
        type: custom
