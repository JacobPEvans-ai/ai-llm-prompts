      - data:
          code: |-
            import json
            import re

            REPO_RE = re.compile(r"^dryvist/[A-Za-z0-9_.-]+$")

            def main(repo: str, read_set: str) -> dict:
                if not isinstance(repo, str) or REPO_RE.fullmatch(repo) is None or not isinstance(read_set, str) or not read_set.strip():
                    return {"ready": 0, "request_json": "{}"}
                return {"ready": 1, "request_json": json.dumps({"repositories": [repo], "token_set": read_set})}
          code_language: python3
          desc: Selects the declared read-only GitHub token set for the mandated repository.
