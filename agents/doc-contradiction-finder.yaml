name: doc-contradiction-finder
extends: event-worker
description: |
  Use when: merged documentation changes need a contradiction check.
  Do not use when: the request needs page edits or unrelated code analysis.
connectors: [github-clerk]
code_work: none
tools:
  - github.pulls.get
  - github.pulls.diff
  - github.repos.get
privacy_class: private
triggers:
  - kind: event
    source: github.pull_request
    skew_minutes: 0
    event_filter:
      event: pull_request
      action: [closed]
      merged: true
      org: dryvist
      base_branch: main
    repositories:
      - repo: dryvist/ai-llm-prompts
        paths: [auto-ai-agent/instructions/**, agents/prompts/**]
    # The private documentation repository is resolved from the runtime secret store.
    private_repository_env: DOC_FINDER_PRIVATE_REPO
reader: documentation maintainer
acted_signal: contradiction fix merged
mandate_binding:
  required_fields: [repo, pr_number]
  event: pull_request
channels:
  live: disabled_until_slack_handoff_bound
identity: agent-doc-contradiction-finder
api_key_ref: agent-key/doc-contradiction-finder
secret_ref: agent-key/doc-contradiction-finder
github_token_ref: github-token/doc-contradiction-finder
dify:
  app: {description: Read-only contradiction finder for documentation pages after merged pull requests. Shadow mode; never
      edits or posts., icon: 🤖, icon_background: '#D5F5F6', mode: workflow, name: __DIFY_AGENT_NAME__, use_icon_as_answer_icon: false}
  dependencies: []
  kind: app
  version: 0.7.0
  workflow:
    conversation_variables: []
    environment_variables:
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50201
      name: OPENBAO_ADDR
      value: ''
      value_type: string
      description: OpenBao base URL supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50202
      name: OPENBAO_ROLE_ID
      value: ''
      value_type: secret
      description: OpenBao AppRole role ID supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50203
      name: OPENBAO_SECRET_ID
      value: ''
      value_type: secret
      description: OpenBao AppRole secret ID supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50204
      name: GITHUB_API_BASE
      value: ''
      value_type: string
      description: GitHub API base URL supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50205
      name: GITHUB_TOKEN_MINT_PATH
      value: ''
      value_type: string
      description: Approved installation-token mint path supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50208
      name: GITHUB_TOKEN_READ_SET
      value: ''
      value_type: string
      description: Read-only token set for github-token/doc-contradiction-finder.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50209
      name: DOC_FINDER_PRIVATE_REPO
      value: ''
      value_type: secret
      description: Private documentation repository name supplied from the runtime secret store; the event router matches
        it.
      selector: []
    features:
      file_upload: {enabled: false}
      opening_statement: ''
      retriever_resource: {enabled: false}
      sensitive_word_avoidance: {enabled: false}
      speech_to_text: {enabled: false}
      suggested_questions: []
      suggested_questions_after_answer: {enabled: false}
      text_to_speech: {enabled: false}
    graph:
