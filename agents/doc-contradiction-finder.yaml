          selected: false
          title: Start
          type: start
        height: 90
        id: start
        position: {x: 30, y: 500}
        positionAbsolute: {x: 30, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import re

            REPO_RE = re.compile(r"^dryvist/[A-Za-z0-9_.-]+$")

            def main(event: str, action: str, merged: str, org: str, repo: str, pr_number: int) -> dict:
                valid = (
                    event == "pull_request"
                    and action == "closed"
                    and str(merged).lower() == "true"
                    and isinstance(org, str)
                    and org.lower() == "dryvist"
                    and isinstance(repo, str)
                    and REPO_RE.fullmatch(repo) is not None
                    and isinstance(pr_number, int)
                    and not isinstance(pr_number, bool)
                    and pr_number > 0
                )
                return {"eligible": 1 if valid else 0}
          code_language: python3
          desc: Accepts only merged pull_request closed events from dryvist repositories.
          outputs:
            eligible: {type: number, children: null}
          selected: false
          title: Validate merged PR event
          type: code
          variables:
          - variable: event
            value_selector: [start, event]
          - variable: action
            value_selector: [start, action]
          - variable: merged
            value_selector: [start, merged]
          - variable: org
            value_selector: [start, org]
          - variable: repo
            value_selector: [start, repo]
          - variable: pr_number
            value_selector: [start, pr_number]
        height: 54
        id: validate_event
        position: {x: 334, y: 500}
        positionAbsolute: {x: 334, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
          - case_id: eligible
            id: eligible
            logical_operator: and
            conditions:
            - comparison_operator: '='
              id: event-eligible
              value: '1'
              varType: number
              variable_selector: [validate_event, eligible]
          desc: Ignores events outside the declared trigger.
          selected: false
