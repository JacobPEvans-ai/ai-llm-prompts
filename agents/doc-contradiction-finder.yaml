          body:
            type: json
            data:
            - {key: '', type: text, value: '{{#token_request.request_json#}}'}
          desc: Mints a short-lived installation token for read-only repository access.
          headers: 'Content-Type: application/json'
          method: post
          params: ''
          selected: false
          ssl_verify: true
          timeout: {connect: 10, read: 30, write: 30}
          title: Mint repository-scoped GitHub token
          type: http-request
          url: '{{#env.OPENBAO_ADDR#}}{{#env.GITHUB_TOKEN_MINT_PATH#}}'
        height: 90
