        positionAbsolute: {x: 942, y: 350}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json

            def main(response_body: str) -> dict:
                try:
                    token = json.loads(response_body).get("auth", {}).get("client_token", "")
                except (TypeError, ValueError, AttributeError):
                    token = ""
                return {"client_token": token, "ready": 1 if token else 0}
          code_language: python3
          desc: Extracts the short-lived OpenBao client token.
          outputs:
            client_token: {type: string, children: null}
            ready: {type: number, children: null}
