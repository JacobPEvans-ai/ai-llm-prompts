name: plan-reconciler
owner: agent-platform
tier: 0
triggers:
  - {kind: call, source: planning-lead, cadence: null, skew_minutes: null}
home_platform: dify
shadows: [sim, langflow]
mode: shadow
privacy_class: private
connectors: [vikunja-clerk, github-clerk]
code_work: sandbox
procedure:
  - repo: dryvist/claude-code-plugins
    path: ai-cli-harness-better-practices/skills/replan/SKILL.md
prompt: agents/prompts/plan-reconciler.md
shared_prefix: agents/prompts/shared/homelab.md
tools: [agentgateway.call, agent-sandbox.jobs]
mcp_servers: []
litellm_role: medium
model_policy: {locality: local_only, cloud_fallback: forbidden}
callers: [planning-lead]
channels: [caller, langfuse-trace, phoenix-trace]
memory_scope: none
eval_set: agents/evals/plan-reconciler.yaml
promotion:
  after_shadow_days: 7
  require_eval_pass: true
  require_no_langfuse_score_regression: true
  demote_on_score_regression: true
  authority: master
  log_via: vikunja-clerk
  against: agents/evals/plan-reconciler.yaml
identity: agent-plan-reconciler
input: Authorized plan path, worktree, current decisions, and references to git, PR, test, and tracker evidence.
