name: plan-reconciler
extends: interactive
description: |
  Use when: a planning lead asks to reconcile a stale authorized plan.
  Do not use when: the request is to implement the plan.
  Typical triggers include a merged pull request (event), merged checkpoints and contradictory plan status. See "When to invoke" in the agent prompt.
privacy_class: private
identity: agent-plan-reconciler
api_key_ref: openbao://agent-key/plan-reconciler
reader: planning lead
acted_signal: The lead acts on the reconciled plan and blockers.
triggers:
  - {kind: call, source: planning-lead}
  - kind: event
    source: github.pull_request
    skew_minutes: 0
    event_filter:
      event: pull_request
      action: [closed]
      merged: true
      org: dryvist
mandate_binding:
  required_fields: [repo, pr_number]
  event: pull_request
connectors: [github-clerk, vikunja-clerk]
code_work: sandbox
tools: [a2a.call, agent-sandbox.jobs]
procedure:
  - {repo: dryvist/claude-code-plugins, path: ai-cli-harness-better-practices/skills/replan/SKILL.md}
input: Authorized plan path, worktree, decisions, and current artifact, test, PR, and task evidence.
