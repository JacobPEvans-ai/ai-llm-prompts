          default_value:
            - {key: status_code, type: number, value: 0}
          method: post
          url: '{{#env.RELEASE_DIGEST_TRIGGER_URL#}}/triggers/webhook/{{#env.RELEASE_DIGEST_WEBHOOK_ID#}}'
          authorization: {type: no-auth}
          headers: ''
          params: ''
          body: {type: none, data: ''}
          timeout: {connect: 5, read: 10, write: 10}
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
          ssl_verify: true
      - id: check-vikunja-triage
        type: custom
        position: {x: 3600, y: 0}
        data:
          title: vikunja-triage due
          type: if-else
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - {id: due-vikunja-triage, variable_selector: [due, due], varType: 'array[string]', comparison_operator: contains, value: vikunja-triage}
      - id: dispatch-vikunja-triage
        type: custom
        position: {x: 3900, y: 200}
        data:
          title: Dispatch vikunja-triage
          type: http-request
          error_strategy: default-value
          default_value:
            - {key: status_code, type: number, value: 0}
          method: post
          url: '{{#env.VIKUNJA_TRIAGE_TRIGGER_URL#}}/triggers/webhook/{{#env.VIKUNJA_TRIAGE_WEBHOOK_ID#}}'
          authorization: {type: no-auth}
          headers: ''
          params: ''
          body: {type: none, data: ''}
          timeout: {connect: 5, read: 10, write: 10}
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
          ssl_verify: true
      - id: check-zammad-triage
        type: custom
        position: {x: 4200, y: 0}
        data:
          title: zammad-triage due
          type: if-else
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - {id: due-zammad-triage, variable_selector: [due, due], varType: 'array[string]', comparison_operator: contains, value: zammad-triage}
      - id: dispatch-zammad-triage
        type: custom
