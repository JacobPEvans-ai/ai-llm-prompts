# Generated from agents/*.yaml, agents/dify-src/rotation.tmpl, and helpers/rotation_due.py; run make render-dify.
app: {name: tier2-rotation, mode: workflow, description: Dispatch tier-2 rotation windows.}
dependencies: []
kind: app
version: 0.7.0
workflow:
  environment_variables:
    - {id: rotation-speed, name: ROTATION_SPEED, value_type: number, value: 1.0, selector: [env, ROTATION_SPEED]}
    - {id: rotation-offset, name: ROTATION_OFFSET, value_type: number, value: 0, selector: [env, ROTATION_OFFSET]}
    - {id: rotation-paused, name: ROTATION_PAUSED, value_type: string, value: 'false', selector: [env, ROTATION_PAUSED]}
    - {id: ai-news-trigger-url, name: AI_NEWS_TRIGGER_URL, value_type: string, value: '', selector: [env, AI_NEWS_TRIGGER_URL]}
    - {id: ai-news-webhook-id, name: AI_NEWS_WEBHOOK_ID, value_type: secret, value: '', selector: [env, AI_NEWS_WEBHOOK_ID]}
    - {id: daily-innovation-trigger-url, name: DAILY_INNOVATION_TRIGGER_URL, value_type: string, value: '', selector: [env, DAILY_INNOVATION_TRIGGER_URL]}
    - {id: daily-innovation-webhook-id, name: DAILY_INNOVATION_WEBHOOK_ID, value_type: secret, value: '', selector: [env, DAILY_INNOVATION_WEBHOOK_ID]}
    - {id: donna-research-trigger-url, name: DONNA_RESEARCH_TRIGGER_URL, value_type: string, value: '', selector: [env, DONNA_RESEARCH_TRIGGER_URL]}
    - {id: donna-research-webhook-id, name: DONNA_RESEARCH_WEBHOOK_ID, value_type: secret, value: '', selector: [env, DONNA_RESEARCH_WEBHOOK_ID]}
    - {id: model-scout-trigger-url, name: MODEL_SCOUT_TRIGGER_URL, value_type: string, value: '', selector: [env, MODEL_SCOUT_TRIGGER_URL]}
    - {id: model-scout-webhook-id, name: MODEL_SCOUT_WEBHOOK_ID, value_type: secret, value: '', selector: [env, MODEL_SCOUT_WEBHOOK_ID]}
    - {id: release-digest-trigger-url, name: RELEASE_DIGEST_TRIGGER_URL, value_type: string, value: '', selector: [env, RELEASE_DIGEST_TRIGGER_URL]}
    - {id: release-digest-webhook-id, name: RELEASE_DIGEST_WEBHOOK_ID, value_type: secret, value: '', selector: [env, RELEASE_DIGEST_WEBHOOK_ID]}
    - {id: vikunja-triage-trigger-url, name: VIKUNJA_TRIAGE_TRIGGER_URL, value_type: string, value: '', selector: [env, VIKUNJA_TRIAGE_TRIGGER_URL]}
    - {id: vikunja-triage-webhook-id, name: VIKUNJA_TRIAGE_WEBHOOK_ID, value_type: secret, value: '', selector: [env, VIKUNJA_TRIAGE_WEBHOOK_ID]}
    - {id: zammad-triage-trigger-url, name: ZAMMAD_TRIAGE_TRIGGER_URL, value_type: string, value: '', selector: [env, ZAMMAD_TRIAGE_TRIGGER_URL]}
    - {id: zammad-triage-webhook-id, name: ZAMMAD_TRIAGE_WEBHOOK_ID, value_type: secret, value: '', selector: [env, ZAMMAD_TRIAGE_WEBHOOK_ID]}
  graph:
    edges:
      - {id: schedule-due, source: schedule, sourceHandle: source, target: due, targetHandle: target, type: custom, data: {sourceType: trigger-schedule, targetType: code}}
      - {id: due-ai-news, source: due, sourceHandle: 'source', target: check-ai-news, targetHandle: target, type: custom, data: {sourceType: code, targetType: if-else}}
      - {id: ai-news-dispatch, source: check-ai-news, sourceHandle: 'true', target: dispatch-ai-news, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: check-ai-news-daily-innovation, source: check-ai-news, sourceHandle: 'false', target: check-daily-innovation, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: if-else}}
      - {id: dispatch-check-ai-news-daily-innovation, source: dispatch-ai-news, sourceHandle: source, target: check-daily-innovation, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: if-else}}
      - {id: daily-innovation-dispatch, source: check-daily-innovation, sourceHandle: 'true', target: dispatch-daily-innovation, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: check-daily-innovation-donna-research, source: check-daily-innovation, sourceHandle: 'false', target: check-donna-research, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: if-else}}
      - {id: dispatch-check-daily-innovation-donna-research, source: dispatch-daily-innovation, sourceHandle: source, target: check-donna-research, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: if-else}}
      - {id: donna-research-dispatch, source: check-donna-research, sourceHandle: 'true', target: dispatch-donna-research, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: check-donna-research-model-scout, source: check-donna-research, sourceHandle: 'false', target: check-model-scout, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: if-else}}
      - {id: dispatch-check-donna-research-model-scout, source: dispatch-donna-research, sourceHandle: source, target: check-model-scout, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: if-else}}
      - {id: model-scout-dispatch, source: check-model-scout, sourceHandle: 'true', target: dispatch-model-scout, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: check-model-scout-release-digest, source: check-model-scout, sourceHandle: 'false', target: check-release-digest, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: if-else}}
      - {id: dispatch-check-model-scout-release-digest, source: dispatch-model-scout, sourceHandle: source, target: check-release-digest, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: if-else}}
      - {id: release-digest-dispatch, source: check-release-digest, sourceHandle: 'true', target: dispatch-release-digest, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: check-release-digest-vikunja-triage, source: check-release-digest, sourceHandle: 'false', target: check-vikunja-triage, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: if-else}}
      - {id: dispatch-check-release-digest-vikunja-triage, source: dispatch-release-digest, sourceHandle: source, target: check-vikunja-triage, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: if-else}}
      - {id: vikunja-triage-dispatch, source: check-vikunja-triage, sourceHandle: 'true', target: dispatch-vikunja-triage, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: check-vikunja-triage-zammad-triage, source: check-vikunja-triage, sourceHandle: 'false', target: check-zammad-triage, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: if-else}}
      - {id: dispatch-check-vikunja-triage-zammad-triage, source: dispatch-vikunja-triage, sourceHandle: source, target: check-zammad-triage, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: if-else}}
      - {id: zammad-triage-dispatch, source: check-zammad-triage, sourceHandle: 'true', target: dispatch-zammad-triage, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: http-request}}
      - {id: last-log, source: check-zammad-triage, sourceHandle: 'false', target: tick-log, targetHandle: target, type: custom, data: {sourceType: if-else, targetType: code}}
      - {id: last-dispatch-log, source: dispatch-zammad-triage, sourceHandle: source, target: tick-log, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: code}}
      - {id: log-done, source: tick-log, sourceHandle: source, target: done, targetHandle: target, type: custom, data: {sourceType: code, targetType: end}}
    nodes:
      - id: schedule
        type: custom
        position: {x: 0, y: 0}
        data: {title: Odd minutes, type: trigger-schedule, mode: cron, cron_expression: '1-59/2 * * * *', timezone: UTC}
      - id: due
        type: custom
        position: {x: 300, y: 0}
        data:
          title: Rotation windows
          type: code
          code_language: python3
          code: |
            """Select two-minute rotation windows from UTC epoch minutes, without I/O or state."""

            import json
            import math


            def rotation_due(now, agents, ROTATION_SPEED=1.0, ROTATION_OFFSET=0, ROTATION_PAUSED=False):
                speed = float(ROTATION_SPEED)
                shift = float(ROTATION_OFFSET)
                now = float(now)
                if not all(math.isfinite(value) for value in (now, speed, shift)) or speed <= 0:
                    raise ValueError("rotation time and offset must be finite; speed must be positive")
                if str(ROTATION_PAUSED).lower() not in {"true", "false"}:
                    raise ValueError("ROTATION_PAUSED must be true or false")
                paused = str(ROTATION_PAUSED).lower() == "true"
                due, skipped = [], []
                for agent in agents:
                    period = round(agent["every_minutes"] * speed)
                    if period < 2:
                        raise ValueError("scaled rotation interval must be at least two minutes")
                    target = due if not paused and (now + shift - agent["offset_minutes"]) % period < 2 else skipped
                    target.append(agent["name"])
                return {
                    "due": due,
                    "skipped": skipped,
                    "log": json.dumps({
                        "due": due, "skipped": skipped,
                        "ROTATION_SPEED": speed, "ROTATION_OFFSET": shift, "ROTATION_PAUSED": paused,
                    }, separators=(",", ":")),
                }

            ROTATION_AGENTS = [{"every_minutes":1440,"expected_runtime_minutes":10,"name":"ai-news","offset_minutes":0},{"every_minutes":1440,"expected_runtime_minutes":10,"name":"daily-innovation","offset_minutes":205},{"every_minutes":1440,"expected_runtime_minutes":10,"name":"donna-research","offset_minutes":411},{"every_minutes":1440,"expected_runtime_minutes":10,"name":"model-scout","offset_minutes":617},{"every_minutes":1440,"expected_runtime_minutes":10,"name":"release-digest","offset_minutes":822},{"every_minutes":1440,"expected_runtime_minutes":10,"name":"vikunja-triage","offset_minutes":1028},{"every_minutes":1440,"expected_runtime_minutes":10,"name":"zammad-triage","offset_minutes":1234}]

            def main(timestamp, speed, offset, paused):
                return rotation_due(float(timestamp) // 60, ROTATION_AGENTS, speed, offset, paused)
          variables:
            - {variable: timestamp, value_selector: [sys, timestamp]}
            - {variable: speed, value_selector: [env, ROTATION_SPEED]}
            - {variable: offset, value_selector: [env, ROTATION_OFFSET]}
            - {variable: paused, value_selector: [env, ROTATION_PAUSED]}
          outputs:
            due: {type: 'array[string]', children: null}
            skipped: {type: 'array[string]', children: null}
            log: {type: string, children: null}
      - id: check-ai-news
        type: custom
        position: {x: 600, y: 0}
        data:
          title: ai-news due
          type: if-else
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - {id: due-ai-news, variable_selector: [due, due], varType: 'array[string]', comparison_operator: contains, value: ai-news}
      - id: dispatch-ai-news
        type: custom
        position: {x: 900, y: 200}
        data:
          title: Dispatch ai-news
          type: http-request
          error_strategy: default-value
          default_value:
            - {key: status_code, type: number, value: 0}
          method: post
          url: '{{#env.AI_NEWS_TRIGGER_URL#}}/triggers/webhook/{{#env.AI_NEWS_WEBHOOK_ID#}}'
          authorization: {type: no-auth}
          headers: ''
          params: ''
          body: {type: none, data: ''}
          timeout: {connect: 5, read: 10, write: 10}
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
          ssl_verify: true
      - id: check-daily-innovation
        type: custom
        position: {x: 1200, y: 0}
        data:
          title: daily-innovation due
          type: if-else
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - {id: due-daily-innovation, variable_selector: [due, due], varType: 'array[string]', comparison_operator: contains, value: daily-innovation}
      - id: dispatch-daily-innovation
        type: custom
        position: {x: 1500, y: 200}
        data:
          title: Dispatch daily-innovation
          type: http-request
          error_strategy: default-value
          default_value:
            - {key: status_code, type: number, value: 0}
          method: post
          url: '{{#env.DAILY_INNOVATION_TRIGGER_URL#}}/triggers/webhook/{{#env.DAILY_INNOVATION_WEBHOOK_ID#}}'
          authorization: {type: no-auth}
          headers: ''
          params: ''
          body: {type: none, data: ''}
          timeout: {connect: 5, read: 10, write: 10}
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
          ssl_verify: true
      - id: check-donna-research
        type: custom
        position: {x: 1800, y: 0}
        data:
          title: donna-research due
          type: if-else
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - {id: due-donna-research, variable_selector: [due, due], varType: 'array[string]', comparison_operator: contains, value: donna-research}
      - id: dispatch-donna-research
        type: custom
        position: {x: 2100, y: 200}
        data:
          title: Dispatch donna-research
          type: http-request
          error_strategy: default-value
          default_value:
            - {key: status_code, type: number, value: 0}
          method: post
          url: '{{#env.DONNA_RESEARCH_TRIGGER_URL#}}/triggers/webhook/{{#env.DONNA_RESEARCH_WEBHOOK_ID#}}'
          authorization: {type: no-auth}
          headers: ''
          params: ''
          body: {type: none, data: ''}
          timeout: {connect: 5, read: 10, write: 10}
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
          ssl_verify: true
      - id: check-model-scout
        type: custom
        position: {x: 2400, y: 0}
        data:
          title: model-scout due
          type: if-else
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
                - {id: due-model-scout, variable_selector: [due, due], varType: 'array[string]', comparison_operator: contains, value: model-scout}
      - id: dispatch-model-scout
        type: custom
        position: {x: 2700, y: 200}
        data:
          title: Dispatch model-scout
          type: http-request
          error_strategy: default-value
          default_value:
            - {key: status_code, type: number, value: 0}
          method: post
          url: '{{#env.MODEL_SCOUT_TRIGGER_URL#}}/triggers/webhook/{{#env.MODEL_SCOUT_WEBHOOK_ID#}}'
          authorization: {type: no-auth}
          headers: ''
          params: ''
          body: {type: none, data: ''}
          timeout: {connect: 5, read: 10, write: 10}
          retry_config: {retry_enabled: false, max_retries: 0, retry_interval: 0}
          ssl_verify: true
      - id: check-release-digest
        type: custom
        position: {x: 3000, y: 0}
        data:
          title: release-digest due
          type: if-else
          cases:
            - case_id: 'true'
              logical_operator: and
              conditions:
