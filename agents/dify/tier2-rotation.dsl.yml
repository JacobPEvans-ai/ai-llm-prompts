      - id: tick-log
        type: custom
        position: {x: 4800, y: 0}
        data:
          title: Dispatch results
          type: code
          code_language: python3
          code: |
            import json

            def main(log, **statuses):
                tick = json.loads(log)
                tick["failures"] = [name for name in tick["due"]
                                    if not 200 <= (statuses.get("status_" + name.replace("-", "_")) or 0) < 300]
                return {"log": json.dumps(tick, separators=(",", ":"))}
          variables:
            - {variable: log, value_selector: [due, log]}
            - {variable: status_ai_news, value_selector: [dispatch-ai-news, status_code]}
            - {variable: status_daily_innovation, value_selector: [dispatch-daily-innovation, status_code]}
