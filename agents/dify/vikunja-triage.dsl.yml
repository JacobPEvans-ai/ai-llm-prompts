            SECRET_RE = re.compile(
                r"(?i)(?:(?P<label>(?:api[_-]?key|secret|token)\s*[:=]\s*['\"]?)[A-Za-z0-9_./+=-]{24,}"
                r"|(?P<bearer>\bBearer\s+)[A-Za-z0-9._~+/=-]{16,}|xox[abposr]-[A-Za-z0-9-]{10,}|\bhv[sbr]\.[A-Za-z0-9_-]{20,}"
                r"|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{30,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})"
            )
            # Public GitHub links keep their host and path. Secrets inside them are still redacted.
            PUBLIC_LINK_RE = re.compile(r"https://github\.com/[^\s<>\"']*")
            SECRET_KEY_SEGMENTS = {"token", "authorization", "password", "secret", "cookie", "apikey"}
            HOST_RE = re.compile(r"(?i)\b(?:[A-Z0-9](?:[A-Z0-9-]{0,61}[A-Z0-9])?\.)+[A-Z]{2,63}\b")
            FILE_EXTENSIONS = {"md", "py", "ts", "tsx", "js", "jsx", "json", "yaml", "yml", "toml", "txt", "html", "css"}
            # md and py are also country-code TLDs, so two-label matches may be file references rather than hosts.
            # shortcut: keep that exception until a collision calls for a page-path allowlist.
            CCTLD_EXTENSIONS = {"md", "py"}
            IPV4_RE = re.compile(r"(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])")
            IPV6_RE = re.compile(r"(?<![A-Fa-f0-9:])[A-Fa-f0-9:]{2,}(?![A-Fa-f0-9:])")
            REDACTED = "[REDACTED]"
            MAX_IPV6_LEN = 45  # longest textual IPv6 form (IPv4-mapped, no zone)


            def _is_address(candidate):
                if IPV4_RE.fullmatch(candidate):
                    # ipaddress rejects leading zeros, so read each octet as decimal first.
                    candidate = ".".join(str(int(octet)) for octet in candidate.split("."))
                try:
                    ipaddress.ip_address(candidate)
                    return True
                except ValueError:
                    return False


            def _redact_ipv6(match):
                candidate = match.group(0)
                if ":" not in candidate:
                    return candidate
                # Prose can touch an address on either side ("Peer:2001:db8::1", "2001:db8::: is down", "ab2001:db8::1"); scan the
                # run left to right, redact the longest address at the leftmost start, and keep the text around it.
                parts, pos = [], 0
                while pos < len(candidate):
                    span = _first_address_span(candidate, pos)
                    if span is None:
                        break
                    parts += [candidate[pos : span[0]], REDACTED]
                    pos = span[1]
                return "".join(parts) + candidate[pos:]


            def _first_address_span(candidate, pos):
                for start in range(pos, len(candidate)):
                    for end in range(min(len(candidate), start + MAX_IPV6_LEN), start + 1, -1):
                        span = candidate[start:end]
                        if ":" in span and _is_address(span):
                            return start, end
                return None


            def _redact_host(match):
                name = match.group(0)
                labels = name.lower().split(".")
                if labels[-1] in FILE_EXTENSIONS and (labels[-1] not in CCTLD_EXTENSIONS or len(labels) == 2):
                    return name
                return REDACTED


            def _is_secret_key(key):
                compact = re.sub(r"[^a-z0-9]", "", key.lower())
                if any(word in compact for word in ("password", "secret", "authorization", "cookie", "apikey")) or compact.endswith("token"):
                    return True
                # Keep case-insensitive words as well as camelCase segments (for example, ToKeN).
                words = re.split(r"[^a-z0-9]+", key.lower())
                key = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1_\2", key)
                key = re.sub(r"([a-z0-9])([A-Z])", r"\1_\2", key)
                segments = re.split(r"[^a-z0-9]+", key.lower())
                return any(segment in SECRET_KEY_SEGMENTS for segment in words + segments) or any(
                    left == "api" and right == "key" for left, right in zip(segments, segments[1:])
                )


            def _redact_secrets(text):
                return SECRET_RE.sub(lambda match: (match.group("label") or match.group("bearer") or "") + REDACTED, text)


            def _redact_plain(text):
                text = _redact_secrets(text)
                text = IPV4_RE.sub(lambda match: REDACTED if _is_address(match.group(0)) else match.group(0), text)
                text = IPV6_RE.sub(_redact_ipv6, text)
                return HOST_RE.sub(_redact_host, text)


            def _redact_string(text):
                pieces, position = [], 0
                for match in PUBLIC_LINK_RE.finditer(text):
                    pieces += [_redact_plain(text[position : match.start()]), _redact_secrets(match.group(0))]
                    position = match.end()
                return "".join(pieces) + _redact_plain(text[position:])


            def redact(text):
                if isinstance(text, dict):
                    return {key: REDACTED if _is_secret_key(key) else redact(value) for key, value in text.items()}
                if isinstance(text, list):
                    return [redact(value) for value in text]
                if not isinstance(text, str):
                    return text
                return _redact_string(text)


            def needs_redaction(text):
                return REDACTED in text or redact(text) != text


            """Slack thread delivery for rendered Dify Code nodes.

            The node defines AGENT and TRUSTED_SLACK_HOSTS before it includes this text. The functions read only those names and
            their arguments, and keep no state between runs. Every failure sends one notice and then raises, so the Dify run ends
            failed. Summary text is built by the delivery node, which owns redaction and truncation.
            """

            import datetime
            import json
            import re
            import urllib.parse
            import urllib.request

            CHANNEL_ID = re.compile(r"[CGD][A-Z0-9]+")


            def call(api, token, method, payload=None, query=None):
                parts = urllib.parse.urlsplit(api)
                if parts.scheme != "https" or parts.hostname not in TRUSTED_SLACK_HOSTS:
                    raise RuntimeError("slack api base is not an approved https host")
                url = api.rstrip("/") + "/" + method
                if query:
                    url += "?" + urllib.parse.urlencode(query)
                data = None if payload is None else json.dumps(payload).encode()
                headers = {"Authorization": "Bearer " + token}
                if payload is not None:
                    headers["Content-Type"] = "application/json; charset=utf-8"
                request = urllib.request.Request(url, data=data, headers=headers)
                with urllib.request.urlopen(request, timeout=5) as response:
                    body = json.loads(response.read())
                if not body.get("ok"):
                    raise RuntimeError(method + " failed: " + str(body.get("error", "unknown")))
                return body


            def valid_channel(value):
                """Channel IDs only. A name such as #general would not reliably identify the channel at run time."""
                return isinstance(value, str) and CHANNEL_ID.fullmatch(value) is not None


            def escape_mrkdwn(text):
                """Escape the three characters Slack reads as markup, so model or task text cannot mention, link, or broadcast."""
                return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


            def fetched(value):
                """True when the run fetched any input. An empty list, object, or string is a heartbeat."""
                if isinstance(value, str):
                    if not value.strip():
                        return False
                    try:
                        value = json.loads(value)
                    except ValueError:
                        return True
                if isinstance(value, (list, dict)):
                    return len(value) > 0
                return value is not None


            def day_start(stamp):
                return int(datetime.datetime(stamp.year, stamp.month, stamp.day, tzinfo=datetime.timezone.utc).timestamp())


            def parent_ts(api, token, channel, text, since):
                """Return the ts of this agent's parent post for the day, or None. Follows the history cursor until found or done."""
                cursor = None
                while True:
                    query = {"channel": channel, "oldest": str(since), "limit": 200}
                    if cursor:
                        query["cursor"] = cursor
                    body = call(api, token, "conversations.history", query=query)
                    for message in body.get("messages", []):
                        is_parent = message.get("thread_ts", message.get("ts")) == message.get("ts")
                        if message.get("bot_id") and message.get("text") == text and is_parent:
                            return message["ts"]
                    cursor = (body.get("response_metadata") or {}).get("next_cursor")
                    if not cursor:
                        return None


            def notify_failure(api, token, failure_channel, digest_channel, dashboard_url, stamp, reason):
                """Post one failure line. Returns failed when posted, failed-unreported when not. Never posts to the digest channel."""
                if not valid_channel(failure_channel) or failure_channel == digest_channel:
                    return "failed-unreported"
                text = escape_mrkdwn(
                    AGENT + " " + reason + " at " + stamp.strftime("%Y-%m-%d %H:%M") + " UTC. Dashboard: " + dashboard_url
                )
                try:
                    call(api, token, "chat.postMessage", {"channel": failure_channel, "text": text})
                except Exception:
                    return "failed-unreported"
                return "failed"


            def fail(api, token, failure_channel, digest_channel, dashboard_url, stamp, reason):
                """Send the failure notice, then raise so the Dify run ends failed. The message names no secret or response body."""
                status = notify_failure(api, token, failure_channel, digest_channel, dashboard_url, stamp, reason)
                raise RuntimeError(reason + "; failure notice " + status) from None


            def post_digest(api, token, channel, failure_channel, dashboard_url, stamp, body):
                """Post body as a reply in today's parent thread. Raises, after a failure notice, when any step fails."""
                day = stamp.strftime("%Y-%m-%d")
                parent = AGENT + " digest " + day + " (UTC)"
                try:
                    if not valid_channel(channel):
                        raise ValueError("digest channel is not a channel ID")
                    ts = parent_ts(api, token, channel, parent, day_start(stamp) - 1)
                    if ts is None:
                        ts = call(api, token, "chat.postMessage", {"channel": channel, "text": parent})["ts"]
                    call(api, token, "chat.postMessage", {"channel": channel, "thread_ts": ts, "text": body})
                except Exception:
                    fail(api, token, failure_channel, channel, dashboard_url, stamp, "delivery failed")
                return "posted"


            def clip(text):
                if len(text) <= MAX_CHARS:
                    return text
                cut = text[: MAX_CHARS - len(TRUNCATED)]
                amp = cut.rfind("&")
                if amp != -1 and ";" not in cut[amp:]:
                    cut = cut[:amp]  # never leave half of an escaped entity in the post
                return cut + TRUNCATED


            def summary(outputs):
                text = outputs.get("text")
                if isinstance(text, str):
                    body = text
                else:
                    body = "\n".join(
                        key + ": " + (value if isinstance(value, str) else json.dumps(value, ensure_ascii=False))
                        for key, value in sorted(outputs.items())
                    )
                return clip(escape_mrkdwn(redact(body))) or "(no output)"


            def main(run_timestamp, bot_token, api_base, digest_channel, failure_channel, dashboard_url, input_value, fetch_error="", **outputs):
                stamp = datetime.datetime.fromtimestamp(float(run_timestamp), datetime.timezone.utc)
                if str(fetch_error or "").strip():
                    fail(api_base, bot_token, failure_channel, digest_channel, dashboard_url, stamp, "fetch failed: " + str(fetch_error))
                if not fetched(input_value):
                    return {"status": "skipped"}
                body = summary(outputs)
                return {"status": post_digest(api_base, bot_token, digest_channel, failure_channel, dashboard_url, stamp, body)}
