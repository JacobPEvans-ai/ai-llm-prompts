      - data:
          code: |-
            import json,re,urllib.request
            from urllib.parse import urlsplit
            incident=re.compile(r'\b(?:incidents?|outages?|down|breaches?|vulnerabilit(?:y|ies)|cve|exploits?|leaks?|credentials?|secrets?|security|weakness(?:es)?|compromised|compromise|compromising)\b',re.I)
            def marker_text(value):
                if isinstance(value,dict): return ' '.join(str(x) for x in value.values())
                if isinstance(value,(list,tuple)): return ' '.join(str(x) for x in value)
                return '' if value is None else str(value)
            def has_incident_marker(*values): return any(incident.search(marker_text(x)) for x in values)
            def projects(raw):
                v=json.loads(raw)
                if not isinstance(v,list) or any(not str(x).strip() for x in v): raise ValueError()
                return {str(x).strip() for x in v}
            def state_for(url,web_host,api_base,addr,role,secret,path,cache):
                if url in cache: return cache[url]
                try:
                    p=urlsplit(url); m=re.fullmatch(r'/([^/]+)/([^/]+)/(pull|issues)/([1-9][0-9]*)/?',p.path)
                    if p.scheme!='https' or p.netloc!=web_host or not m: return None
                    auth=urllib.request.Request(addr.rstrip('/')+'/v1/auth/approle/login',data=json.dumps({'role_id':role,'secret_id':secret}).encode(),headers={'Content-Type':'application/json'},method='POST')
                    with urllib.request.urlopen(auth,timeout=10) as r: login=json.loads(r.read())
                    client=login.get('auth',{}).get('client_token','')
                    req=urllib.request.Request(addr.rstrip('/')+'/v1/'+path.strip('/'),headers={'X-Vault-Token':client})
                    with urllib.request.urlopen(req,timeout=10) as r: token_data=json.loads(r.read())
                    data=token_data.get('data',{}); token=data.get('token') or data.get('data',{}).get('token')
                    if not client or not token: return None
                    owner,repo,kind,num=m.groups(); endpoint='pulls' if kind=='pull' else 'issues'
                    gh=urllib.request.Request(api_base.rstrip('/')+f'/repos/{owner}/{repo}/{endpoint}/{num}',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
                    with urllib.request.urlopen(gh,timeout=10) as r: obj=json.loads(r.read())
                    pr=obj.get('pull_request')
                    merged=obj.get('merged') is True or bool(isinstance(pr,dict) and pr.get('merged_at'))
                    value='merged' if merged else str(obj.get('state','')).lower()
                    if (kind=='pull' or 'pull_request' in obj) and value=='closed': value='closed-unmerged'
                    cache[url]=value if value in ('merged','closed','closed-unmerged','open') else None
                    return cache[url]
                except Exception: return None
            def strip_json_fence(text):
                # Remove one surrounding Markdown fence (```json or a bare ```) from model output. Only ASCII spaces, tabs, and
                # line breaks count as whitespace, so the JavaScript mirror trims the same characters. Text without a surrounding
                # fence is returned unchanged.
                value = str(text)
                stripped = value.strip(" \t\r\n")
                if len(stripped) >= 6 and stripped.startswith("```") and stripped.endswith("```"):
                    body = stripped[3:-3].strip(" \t\r\n")
                    if body[:4].lower() == "json":
                        body = body[4:].strip(" \t\r\n")
                    return body
                return value
            def main(model_text:str,refs_text:str,allowed_raw:str,readonly_raw:str,rank_raw:str,denied_raw:str,mode_raw:str,web_host:str,api_base:str,bao_addr:str,role_id:str,secret_id:str,token_path:str)->dict:
                actions=[]; seen=set(); mode=str(mode_raw or '').strip().lower()
                try:
                    allowed,readonly,rank_only,denied=map(projects,(allowed_raw,readonly_raw,rank_raw,denied_raw))
                    refs=json.loads(refs_text)
                    if rank_only-allowed or mode not in ('shadow','live'): raise ValueError()
                except Exception: return {'actions':[],'actions_json':'[]','dispatch':False,'mode':'invalid'}
                try:
                    intent=json.loads(strip_json_fence(model_text)); proposed=intent.get('actions',[]) if isinstance(intent,dict) else []
                except Exception: proposed=[]
                cache={}
                allowed_operations={'comment', 'list', 'update'}
                def add(ref,op,**fields):
                    if op not in allowed_operations: raise ValueError('Operation is not declared by this agent.')
                    key=(ref['id'],op,json.dumps(fields,sort_keys=True,ensure_ascii=False))
                    if key in seen:return
                    seen.add(key); actions.append({'operation':op,'id':ref['id'],'projectId':ref['project_id'],**fields})
                for ref in refs:
                    project=ref['project_id']
                    if project in denied or project not in allowed|readonly: continue
                    text=(str(ref.get('title',''))+' '+str(ref.get('description','')))
                    if has_incident_marker(ref.get('title'),ref.get('description'),ref.get('category'),ref.get('categories')):
                        if project in allowed and project not in rank_only: add(ref,'comment',comment='This item belongs in Zammad.')
                        continue
                    for item in proposed if isinstance(proposed,list) else []:
                        if not isinstance(item,dict) or type(item.get('task_index')) is not int or item['task_index']!=ref['task_index']: continue
                        kind=item.get('kind')
                        if kind=='rank' and project in allowed:
                            fields={}
                            p=item.get('priority',ref.get('priority'))
                            if isinstance(p,(int,float)) and not isinstance(p,bool): fields['priority']=p
                            labels=item.get('labels',ref.get('labels',[]))
                            if isinstance(labels,list) and all(isinstance(x,str) for x in labels): fields['labels']=labels
                            if fields: add(ref,'update',**fields)
                        elif kind in ('comment','done') and project in allowed and project not in rank_only:
                            urls=re.findall(r'https://[^\s<>"\']+',text)
                            for raw_url in urls:
                                url=raw_url.rstrip('.,);]')
                                state=state_for(url,web_host,api_base,bao_addr,role_id,secret_id,token_path,cache)
                                if state is None: continue
                                if kind=='comment':
                                    add(ref,'comment',comment=f'Linked GitHub work: {url} (state: {state}).')
                                    break
                                if kind=='done' and state in ('merged','closed') and not ref.get('done'):
                                    add(ref,'update',done=True); break
                return {'actions':actions,'actions_json':json.dumps(actions,ensure_ascii=False),'dispatch':mode=='live','mode':mode}
          code_language: python3
