      - data:
          code: |-
            import json

            FIELDS = ("ts", "user", "text", "thread_ts", "reply_count", "subtype")

            def payload_from(value):
                if isinstance(value, dict):
                    if isinstance(value.get("messages"), list):
                        return value
                    for key in ("json", "data", "content", "text"):
                        if key in value:
                            found = payload_from(value[key])
                            if found is not None:
                                return found
                elif isinstance(value, list):
                    for item in value:
                        found = payload_from(item)
                        if found is not None:
                            return found
                elif isinstance(value, str):
                    try:
                        return payload_from(json.loads(value))
                    except (TypeError, ValueError):
                        decoder = json.JSONDecoder()
                        for offset, char in enumerate(value):
                            if char == "{":
                                try:
                                    item, _ = decoder.raw_decode(value, offset)
                                except ValueError:
                                    continue
                                found = payload_from(item)
                                if found is not None:
                                    return found
                return None

            def main(response_json) -> dict:
                value = payload_from(response_json)
                raw_error = str(response_json or "").lower()
                if value is None and "channel_not_found" in raw_error:
                    return {"status": "not_found", "items": [], "error": "channel was not found"}
                if not isinstance(value, dict) or not isinstance(value.get("messages"), list):
                    return {"status": "error", "items": [], "error": "channel history response had an unexpected shape"}
                if value.get("ok") is False:
                    return {"status": "error", "items": [], "error": "channel history read failed"}
                items = [{key: message[key] for key in FIELDS if key in message and isinstance(message[key], (str, int, float, bool, type(None)))} for message in value["messages"] if isinstance(message, dict)]
                return {"status": "found" if items else "not_found", "items": items, "error": "" if items else "no channel messages were found"}
          code_language: python3
          outputs:
