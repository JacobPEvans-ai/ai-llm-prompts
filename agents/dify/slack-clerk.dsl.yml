      - data:
          code: |-
            import json
            import re

            CHANNEL_RE = re.compile(r"^[CGD][A-Z0-9]+$")
            THREAD_TS_RE = re.compile(r"^[0-9]{1,20}\.[0-9]{1,6}$")

            def result(allowed, status, error, operation="", channel="", thread_ts="", limit=0):
                return {"allowed": allowed, "status": status, "items": [], "error": error, "operation": operation, "channel": channel, "thread_ts": thread_ts, "limit": limit}

            def main(intent_text: str, operation_raw: str, channel_raw: str, thread_ts_raw: str, limit_raw, allowed_raw: str) -> dict:
                operation = str(operation_raw or "").strip()
                try:
                    intent = json.loads(str(intent_text or ""))
                except (TypeError, ValueError):
                    intent = None
                if not isinstance(intent, dict) or set(intent) != {"operation"} or intent.get("operation") != operation:
                    return result(False, "refused", "request classification did not match the typed operation")
                if operation not in ("get_channel_history", "get_thread_replies"):
                    return result(False, "refused", "operation is outside the read-only scope")
                channel = str(channel_raw or "").strip()
                if not CHANNEL_RE.fullmatch(channel):
                    return result(False, "refused", "channel identifier has an invalid format")
                try:
                    allowed_channels = json.loads(str(allowed_raw or ""))
                except (TypeError, ValueError):
                    return result(False, "error", "channel allowlist configuration is invalid")
                if not isinstance(allowed_channels, list) or not allowed_channels or any(not isinstance(item, str) or not CHANNEL_RE.fullmatch(item.strip()) for item in allowed_channels):
                    return result(False, "error", "channel allowlist configuration is invalid")
                allowed_channels = [item.strip() for item in allowed_channels]
                if channel not in allowed_channels:
                    return result(False, "refused", "channel is not on the allowed list")
                thread_ts = str(thread_ts_raw or "").strip()
                if operation == "get_channel_history" and thread_ts:
                    return result(False, "refused", "channel history does not accept a thread timestamp")
                if operation == "get_thread_replies" and not THREAD_TS_RE.fullmatch(thread_ts):
                    return result(False, "refused", "thread replies require a valid parent timestamp")
                default_limit = 20 if operation == "get_channel_history" else 100
                if limit_raw in (None, "", 0, 0.0):
                    limit = default_limit
                elif isinstance(limit_raw, bool) or not isinstance(limit_raw, (int, float)) or int(limit_raw) != limit_raw or not 1 <= int(limit_raw) <= 100:
                    return result(False, "refused", "limit must be a whole number from 1 to 100")
                else:
                    limit = int(limit_raw)
                return result(True, "", "", operation, channel, thread_ts, limit)
          code_language: python3
          outputs:
            allowed:
              type: boolean
            channel:
              children: null
              type: string
            error:
              children: null
              type: string
            items:
              children: null
              type: array[object]
            limit:
              type: number
            operation:
