      - data:
          code: |-
            import json
            import re

            SHA_RE = re.compile(r"^[0-9a-f]{40}$")
            LOG_REDACTION_AVAILABLE = False

            def main(payload_repo: str, payload_head_ref: str, payload_head_sha: str, payload_check_run_id: int, payload_pr_number: int, check_run_body: str, annotations_body: str, current_pr_body: str, rules_body: str, files_body: str, head_commit_body: str) -> dict:
                try:
                    check = json.loads(check_run_body)
                    annotations = json.loads(annotations_body)
                    pr = json.loads(current_pr_body)
                    rules = json.loads(rules_body)
                    files = json.loads(files_body)
                    commit = json.loads(head_commit_body)
                except (TypeError, ValueError):
                    return {"eligible": 0, "model_allowed": 0, "tree_sha": "", "current_head_sha": ""}
                if isinstance(rules, dict):
                    rules = rules.get("rules")
                head = pr.get("head") if isinstance(pr.get("head"), dict) else {}
                base = pr.get("base") if isinstance(pr.get("base"), dict) else {}
                head_repo = head.get("repo") if isinstance(head.get("repo"), dict) else {}
                base_repo = base.get("repo") if isinstance(base.get("repo"), dict) else {}
                tree = commit.get("tree") if isinstance(commit.get("tree"), dict) else {}
                changed_lines = 0
                counts_valid = isinstance(files, list) and len(files) <= 3
                if counts_valid:
                    for item in files:
                        if not isinstance(item, dict):
                            counts_valid = False
                            break
                        additions, deletions = item.get("additions"), item.get("deletions")
                        if any(not isinstance(value, int) or isinstance(value, bool) or value < 0 for value in (additions, deletions)):
                            counts_valid = False
                            break
                        changed_lines += additions + deletions
                valid = (
                    isinstance(annotations, list)
                    and isinstance(rules, list)
                    and len(rules) == 0
                    and pr.get("state") == "open"
                    and pr.get("number") == payload_pr_number
                    and base_repo.get("full_name", "").lower() == payload_repo.lower()
                    and head_repo.get("full_name", "").lower() == payload_repo.lower()
                    and head.get("ref") == payload_head_ref
                    and head.get("sha") == payload_head_sha
                    and payload_head_ref not in {"main", "develop"}
                    and SHA_RE.fullmatch(payload_head_sha) is not None
                    and check.get("id") == payload_check_run_id
                    and check.get("status") == "completed"
                    and check.get("conclusion") == "failure"
                    and check.get("head_sha") == payload_head_sha
                    and counts_valid
                    and changed_lines <= 120
                    and SHA_RE.fullmatch(tree.get("sha", "")) is not None
                )
                comment_allowed = (
                    pr.get("number") == payload_pr_number
                    and isinstance(payload_pr_number, int)
                    and not isinstance(payload_pr_number, bool)
                    and payload_pr_number > 0
                    and base_repo.get("full_name", "").lower() == payload_repo.lower()
                )
                return {
                    "eligible": 1 if valid else 0,
                    "comment_allowed": 1 if comment_allowed else 0,
                    "model_allowed": 1 if valid and LOG_REDACTION_AVAILABLE else 0,
                    "tree_sha": tree.get("sha", "") if valid else "",
                    "current_head_sha": head.get("sha", ""),
                    "changed_lines": changed_lines,
                }
          code_language: python3
          desc: Fails closed on unreadable rules, forks, protected refs, stale heads, or patches over 3 files and 120 lines.
          outputs:
            eligible: {type: number, children: null}
            comment_allowed: {type: number, children: null}
            model_allowed: {type: number, children: null}
            tree_sha: {type: string, children: null}
