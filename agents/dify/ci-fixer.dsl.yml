      - data:
          code: |-
            import json

            LOG_REDACTION_AVAILABLE = False

            def main(pr_body: str, expected_head_sha: str, payload_head_ref: str, enable_push: str, commit_body: str) -> dict:
                try:
                    pr = json.loads(pr_body)
                    commit = json.loads(commit_body)
                except (TypeError, ValueError):
                    return {"eligible": 0}
                head = pr.get("head") if isinstance(pr.get("head"), dict) else {}
                new_sha = commit.get("sha", "")
                valid = (
                    pr.get("state") == "open"
                    and head.get("sha") == expected_head_sha
                    and head.get("ref") == payload_head_ref
                    and bool(new_sha)
                    and enable_push == "true"
                    and LOG_REDACTION_AVAILABLE
                )
                return {"eligible": 1 if valid else 0}
          code_language: python3
          desc: Fails closed if the event head moved; the final false guard keeps ref writes disabled until log redaction exists.
          outputs:
            eligible: {type: number, children: null}
          selected: false
