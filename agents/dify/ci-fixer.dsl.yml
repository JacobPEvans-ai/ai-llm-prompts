            - {name: check_run, type: object, required: true}
          content_type: application/json
          desc: The private relay verifies the original HMAC and attests that result before forwarding.
          headers:
            - {name: X-GitHub-Event, type: string, required: true}
            - {name: X-Hub-Delivery, type: string, required: true}
            - {name: X-Relay-Signature-Verified, type: string, required: true}
          method: post
          response_body: ''
          selected: false
          status_code: 200
          title: GitHub check run webhook
          type: trigger-webhook
        height: 90
        id: webhook
        position: {x: 30, y: 500}
        positionAbsolute: {x: 30, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import re
            from urllib.parse import quote

            DELIVERY_RE = re.compile(r"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$")
            REPO_RE = re.compile(r"^[A-Za-z0-9_.-]+$")
            SHA_RE = re.compile(r"^[0-9a-f]{40}$")

            def main(event_name: str, delivery_id: str, relay_signature_verified: str, action: str, organization: dict, repository: dict, check_run: dict) -> dict:
                organization = organization if isinstance(organization, dict) else {}
                repository = repository if isinstance(repository, dict) else {}
                check_run = check_run if isinstance(check_run, dict) else {}
                owner_data = repository.get("owner") if isinstance(repository.get("owner"), dict) else {}
                pull_requests = check_run.get("pull_requests") if isinstance(check_run.get("pull_requests"), list) else []
                linked_pr = pull_requests[0] if len(pull_requests) == 1 and isinstance(pull_requests[0], dict) else {}
                linked_head = linked_pr.get("head") if isinstance(linked_pr.get("head"), dict) else {}
                owner = owner_data.get("login", "")
                repo = repository.get("name", "")
                full_name = repository.get("full_name", "")
                org_login = organization.get("login", "")
                head_ref = check_run.get("head_branch", "") or linked_head.get("ref", "")
                linked_ref = linked_head.get("ref", "")
                head_sha = check_run.get("head_sha", "")
                pull_number = linked_pr.get("number")
                check_run_id = check_run.get("id")
                owner = owner if isinstance(owner, str) else ""
                repo = repo if isinstance(repo, str) else ""
                full_name = full_name if isinstance(full_name, str) else ""
                org_login = org_login if isinstance(org_login, str) else ""
                head_ref = head_ref if isinstance(head_ref, str) else ""
                linked_ref = linked_ref if isinstance(linked_ref, str) else ""
                head_sha = head_sha if isinstance(head_sha, str) else ""
                delivery_id = delivery_id if isinstance(delivery_id, str) else ""
                action = action if isinstance(action, str) else ""
                signature_verified = relay_signature_verified == "true"
                valid = (
                    event_name == "check_run"
                    and action == "completed"
                    and check_run.get("conclusion") == "failure"
                    and signature_verified
                    and DELIVERY_RE.fullmatch(delivery_id) is not None
                    and org_login.lower() == "dryvist"
                    and owner.lower() == "dryvist"
                    and REPO_RE.fullmatch(repo) is not None
                    and full_name.lower() == f"dryvist/{repo}".lower()
                    and len(pull_requests) == 1
                    and isinstance(pull_number, int)
                    and not isinstance(pull_number, bool)
                    and pull_number > 0
                    and isinstance(check_run_id, int)
                    and not isinstance(check_run_id, bool)
                    and check_run_id > 0
                    and isinstance(head_ref, str)
                    and bool(head_ref)
                    and (not linked_ref or linked_ref == head_ref)
                    and SHA_RE.fullmatch(head_sha) is not None
                )
                return {
                    "eligible": 1 if valid else 0,
                    "owner": owner,
                    "repo": repo,
                    "full_name": full_name,
                    "pull_number": pull_number if isinstance(pull_number, int) and not isinstance(pull_number, bool) else 0,
                    "check_run_id": check_run_id if isinstance(check_run_id, int) and not isinstance(check_run_id, bool) else 0,
                    "head_ref": head_ref,
                    "head_ref_path": quote(head_ref, safe=""),
                    "head_sha": head_sha,
                    "delivery_id": delivery_id,
                }
          code_language: python3
          desc: Accepts only an attested failed check_run event with one payload-linked pull request.
          outputs:
            eligible: {type: number, children: null}
            owner: {type: string, children: null}
            repo: {type: string, children: null}
            full_name: {type: string, children: null}
            pull_number: {type: number, children: null}
            check_run_id: {type: number, children: null}
            head_ref: {type: string, children: null}
            head_ref_path: {type: string, children: null}
            head_sha: {type: string, children: null}
            delivery_id: {type: string, children: null}
          selected: false
          title: Verify check run event
          type: code
          variables:
            - {variable: event_name, value_selector: [webhook, X_GitHub_Event]}
            - {variable: delivery_id, value_selector: [webhook, X_Hub_Delivery]}
            - {variable: relay_signature_verified, value_selector: [webhook, X_Relay_Signature_Verified]}
            - {variable: action, value_selector: [webhook, action]}
            - {variable: organization, value_selector: [webhook, organization]}
            - {variable: repository, value_selector: [webhook, repository]}
            - {variable: check_run, value_selector: [webhook, check_run]}
        height: 54
        id: verify_event
        position: {x: 334, y: 500}
        positionAbsolute: {x: 334, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: eligible
              id: eligible
              logical_operator: and
              conditions:
                - {comparison_operator: '=', id: event-eligible, value: '1', varType: number, variable_selector: [verify_event, eligible]}
          desc: Only verified check_run failures for dryvist repositories continue.
          selected: false
          title: Event gate
          type: if-else
        height: 126
        id: event_gate
        position: {x: 638, y: 500}
        positionAbsolute: {x: 638, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization: {type: no-auth}
          body:
            type: json
            data:
              - {key: '', type: text, value: '{"role_id":"{{#env.OPENBAO_ROLE_ID#}}","secret_id":"{{#env.OPENBAO_SECRET_ID#}}"}'}
          desc: AppRole login; keep secret values in Dify environment variables.
          headers: 'Content-Type: application/json'
          method: post
          params: ''
          selected: false
          ssl_verify: true
          timeout: {connect: 10, read: 30, write: 30}
          title: OpenBao AppRole login
          type: http-request
          url: '{{#env.OPENBAO_ADDR#}}/v1/auth/approle/login'
        height: 90
        id: openbao_login
        position: {x: 942, y: 350}
        positionAbsolute: {x: 942, y: 350}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json

            def main(response_body: str) -> dict:
                try:
                    token = json.loads(response_body).get("auth", {}).get("client_token", "")
                except (TypeError, ValueError, AttributeError):
                    token = ""
                return {"client_token": token, "ready": 1 if token else 0}
          code_language: python3
          desc: Extracts the short-lived OpenBao client token.
          outputs:
            client_token: {type: string, children: null}
            ready: {type: number, children: null}
          selected: false
          title: Parse OpenBao response
          type: code
          variables:
            - {variable: response_body, value_selector: [openbao_login, body]}
        height: 54
        id: parse_openbao
        position: {x: 1246, y: 350}
        positionAbsolute: {x: 1246, y: 350}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json

            def main(owner: str, repo: str, pull_number: int, head_ref: str, head_sha: str, delivery_id: str, check_run_body: str, annotations_body: str, files_body: str) -> dict:
                context = {
                    "event": "check_run",
                    "conclusion": "failure",
                    "delivery_id": delivery_id,
                    "repository": f"{owner}/{repo}",
                    "pull_request_number": pull_number,
                    "head_ref": head_ref,
                    "head_sha": head_sha,
                    "check_run": check_run_body,
                    "annotations": annotations_body,
                    "files": files_body,
                    "logs": "unavailable until approved log redaction is connected",
                }
                return {"review_context": json.dumps(context, ensure_ascii=False)}
          code_language: python3
          desc: Builds a bounded event context; the model gate remains closed until log redaction is available.
          outputs:
            review_context: {type: string, children: null}
          selected: false
          title: Prepare CI repair context
          type: code
          variables:
            - {variable: owner, value_selector: [verify_event, owner]}
            - {variable: repo, value_selector: [verify_event, repo]}
            - {variable: pull_number, value_selector: [verify_event, pull_number]}
            - {variable: head_ref, value_selector: [verify_event, head_ref]}
            - {variable: head_sha, value_selector: [verify_event, head_sha]}
            - {variable: delivery_id, value_selector: [verify_event, delivery_id]}
            - {variable: check_run_body, value_selector: [get_check_run, body]}
            - {variable: annotations_body, value_selector: [get_annotations, body]}
            - {variable: files_body, value_selector: [get_pull_files, body]}
        height: 54
        id: prepare_context
        position: {x: 4742, y: 200}
        positionAbsolute: {x: 4742, y: 200}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: ready
              id: ready
              logical_operator: and
              conditions:
                - {comparison_operator: '=', id: login-ready, value: '1', varType: number, variable_selector: [parse_openbao, ready]}
          desc: Stops if OpenBao did not return a token.
          selected: false
          title: OpenBao token gate
          type: if-else
        height: 126
        id: login_gate
        position: {x: 1550, y: 350}
        positionAbsolute: {x: 1550, y: 350}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: api-key
            config: {type: bearer, api_key: '{{#parse_openbao.client_token#}}', header: Authorization}
          body:
            type: json
            data:
              - {key: '', type: text, value: '{"repositories":["{{#verify_event.full_name#}}"]}'}
          desc: Requests an installation token scoped to the payload repository.
          headers: 'Content-Type: application/json'
          method: post
          params: ''
          selected: false
          ssl_verify: true
          timeout: {connect: 10, read: 30, write: 30}
          title: Mint repository-scoped GitHub token
          type: http-request
          url: '{{#env.OPENBAO_ADDR#}}{{#env.GITHUB_TOKEN_MINT_PATH#}}'
        height: 90
        id: mint_github_token
        position: {x: 1854, y: 300}
        positionAbsolute: {x: 1854, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
