      description: Approved installation-token mint path supplied in the Dify workspace.
      selector: []
    - id: 8a4a2c01-1dc7-4ec0-a5e7-5c4120000006
      name: SHARED_PREFIX
      value: ''
      value_type: string
      description: Shared agent prefix supplied in the Dify workspace.
      selector: []
