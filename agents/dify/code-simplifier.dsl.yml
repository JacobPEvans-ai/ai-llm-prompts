      - data:
          code: |-
            import json
            import re

            SECRET_RE = re.compile(r"(?i)(?:-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{30,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|(?:api[_-]?key|secret|token)\s*[:=]\s*['\"]?[A-Za-z0-9_./+=-]{24,})")
            HUNK_RE = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@")

            def main(files_body: str, delivery_id: str, action: str, repo_full_name: str, pull_number: int, head_sha: str, current_pr_body: str, rules_body: str) -> dict:
                fallback = json.dumps({"event": "COMMENT", "body": "Automated review was not produced because the pull request context was unsafe or incomplete.", "comments": []})
                try:
                    files = json.loads(files_body)
                    pr = json.loads(current_pr_body)
                    rules = json.loads(rules_body)
                    if not isinstance(rules, list):
                        rules = rules.get("rules", []) if isinstance(rules, dict) else None
                except (TypeError, ValueError):
                    return {"safe": 0, "fallback_json": fallback, "changed_files_json": "[]", "review_context": ""}
                if not isinstance(files, list) or not isinstance(rules, list) or len(rules) != 0 or len(files) > 40 or len(files) >= 100:
                    return {"safe": 0, "fallback_json": fallback, "changed_files_json": "[]", "review_context": ""}
                total_changes = sum(int(item.get("changes", 0)) for item in files if isinstance(item, dict))
                if total_changes > 6000:
                    return {"safe": 0, "fallback_json": fallback, "changed_files_json": "[]", "review_context": ""}
                changed = []
                context_files = []
                for item in files:
                    if not isinstance(item, dict):
                        return {"safe": 0, "fallback_json": fallback, "changed_files_json": "[]", "review_context": ""}
                    path = item.get("filename")
                    patch = item.get("patch")
                    if not isinstance(path, str) or not path or not isinstance(patch, str):
                        continue
                    if SECRET_RE.search(patch):
                        return {"safe": 0, "fallback_json": fallback, "changed_files_json": "[]", "review_context": ""}
                    new_lines = set()
                    current = None
                    for line in patch.splitlines():
                        match = HUNK_RE.match(line)
                        if match:
                            current = int(match.group(1))
                        elif current is not None and line.startswith("+") and not line.startswith("+++"):
                            new_lines.add(current)
                            current += 1
                        elif current is not None and line.startswith("-") and not line.startswith("---"):
                            continue
                        elif current is not None and not line.startswith("\\"):
                            current += 1
                    changed.append({"path": path, "lines": sorted(new_lines)})
                    context_files.append({"path": path, "status": item.get("status", ""), "patch": patch})
                if not context_files:
                    return {"safe": 0, "fallback_json": fallback, "changed_files_json": json.dumps(changed), "review_context": ""}
                context = {
                    "event": "pull_request",
                    "action": action,
                    "delivery_id": delivery_id,
                    "repository": repo_full_name,
                    "pull_number": pull_number,
                    "commit_sha": head_sha,
                    "pull_request": {
                        "state": pr.get("state"),
                        "draft": pr.get("draft"),
                        "base_repository": pr.get("base", {}).get("repo", {}).get("full_name"),
                        "base_ref": pr.get("base", {}).get("ref"),
                        "head_repository": pr.get("head", {}).get("repo", {}).get("full_name"),
                        "head_ref": pr.get("head", {}).get("ref"),
                        "head_sha": pr.get("head", {}).get("sha"),
                    },
                    "active_branch_rules": len(rules),
                    "files": context_files,
                }
                return {"safe": 1, "fallback_json": fallback, "changed_files_json": json.dumps(changed), "review_context": json.dumps(context, ensure_ascii=False)}
          code_language: python3
          desc: Bounds the diff and prevents likely secrets or incomplete patches from reaching the model.
          outputs:
            safe: {type: number, children: null}
            fallback_json: {type: string, children: null}
            changed_files_json: {type: string, children: null}
            review_context: {type: string, children: null}
          selected: false
          title: Prepare bounded review context
          type: code
          variables:
            - {variable: files_body, value_selector: [get_pull_files, body]}
            - {variable: delivery_id, value_selector: [verify_event, delivery_id]}
            - {variable: action, value_selector: [verify_event, action]}
            - {variable: repo_full_name, value_selector: [verify_event, full_name]}
            - {variable: pull_number, value_selector: [verify_event, pull_number]}
            - {variable: head_sha, value_selector: [verify_event, head_sha]}
            - {variable: current_pr_body, value_selector: [get_pull_request, body]}
            - {variable: rules_body, value_selector: [get_branch_rules, body]}
        height: 54
        id: prepare_review
