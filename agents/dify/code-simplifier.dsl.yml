app:
  description: Bounded, comment-only simplification reviews for eligible pull requests.
  icon: 🤖
  icon_background: '#D5F5F6'
  mode: workflow
  name: code-simplifier
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: "0.7.0"
workflow:
  conversation_variables: []
  environment_variables:
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50101
      name: OPENBAO_ADDR
      value: ''
      value_type: string
      description: OpenBao base URL supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50102
      name: OPENBAO_ROLE_ID
      value: ''
      value_type: secret
      description: OpenBao AppRole role ID supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50103
      name: OPENBAO_SECRET_ID
      value: ''
      value_type: secret
      description: OpenBao AppRole secret ID supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50104
      name: GITHUB_API_BASE
      value: ''
      value_type: string
      description: GitHub API base URL supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50105
      name: GITHUB_TOKEN_MINT_PATH
      value: ''
      value_type: string
      description: Approved installation-token mint path supplied in the Dify workspace.
      selector: []
    - id: 448e86f5-7a8a-4f70-999f-234c9ec50106
      name: SHARED_PREFIX
      value: ''
      value_type: string
      description: Shared agent prefix supplied in the Dify workspace.
      selector: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data: {isInIteration: false, isInLoop: false, sourceType: trigger-webhook, targetType: code}
        id: webhook-verify
        source: webhook
        sourceHandle: source
        target: verify_event
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: if-else}
        id: verify-branch
        source: verify_event
        sourceHandle: source
        target: event_gate
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: http-request}
        id: event-accepted
        source: event_gate
        sourceHandle: eligible
        target: openbao_login
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: end}
        id: event-ignored
        source: event_gate
        sourceHandle: false
        target: end_ignored
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code}
        id: login-parse
        source: openbao_login
        sourceHandle: source
        target: parse_openbao
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: if-else}
        id: login-gate
        source: parse_openbao
        sourceHandle: source
        target: login_ready_gate
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: http-request}
        id: login-ready
        source: login_ready_gate
        sourceHandle: ready
        target: mint_github_token
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: end}
        id: login-failed
        source: login_ready_gate
        sourceHandle: false
        target: end_ignored
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code}
        id: mint-parse
        source: mint_github_token
        sourceHandle: source
        target: parse_github_token
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: if-else}
        id: token-gate
        source: parse_github_token
        sourceHandle: source
        target: token_ready_gate
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: http-request}
        id: token-ready
        source: token_ready_gate
        sourceHandle: ready
        target: get_pull_request
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: end}
        id: token-failed
        source: token_ready_gate
        sourceHandle: false
        target: end_ignored
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: http-request}
        id: pr-branch-rules
        source: get_pull_request
        sourceHandle: source
        target: get_branch_rules
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code}
        id: rules-check
        source: get_branch_rules
        sourceHandle: source
        target: guard_pull_request
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: if-else}
        id: pr-guard-branch
        source: guard_pull_request
        sourceHandle: source
        target: pull_request_gate
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: http-request}
        id: pr-eligible
        source: pull_request_gate
        sourceHandle: eligible
        target: get_pull_files
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: end}
        id: pr-ineligible
        source: pull_request_gate
        sourceHandle: false
        target: end_ignored
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: code}
        id: files-prepare
        source: get_pull_files
        sourceHandle: source
        target: prepare_review
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: if-else}
        id: review-context-gate
        source: prepare_review
        sourceHandle: source
        target: context_gate
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: llm}
        id: review-context-safe
        source: context_gate
        sourceHandle: safe
        target: simplifier_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: if-else, targetType: http-request}
        id: review-context-fallback
        source: context_gate
        sourceHandle: false
        target: post_fallback_review
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: llm, targetType: code}
        id: llm-validate
        source: simplifier_llm
        sourceHandle: source
        target: validate_review
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: http-request}
        id: review-submit
        source: validate_review
        sourceHandle: source
        target: post_review
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: end}
        id: review-end
        source: post_review
        sourceHandle: source
        target: end_reviewed
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: end}
        id: fallback-end
        source: post_fallback_review
        sourceHandle: source
        target: end_reviewed
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          body:
            - {name: action, type: string, required: true}
            - {name: organization, type: object, required: true}
            - {name: repository, type: object, required: true}
            - {name: pull_request, type: object, required: true}
          content_type: application/json
          desc: The private relay verifies the original HMAC and attests that result before forwarding.
          headers:
            - {name: X-GitHub-Event, type: string, required: true}
            - {name: X-Hub-Delivery, type: string, required: true}
            - {name: X-Relay-Signature-Verified, type: string, required: true}
          method: post
          response_body: ''
          selected: false
          status_code: 200
          title: GitHub pull request webhook
          type: trigger-webhook
        height: 90
        id: webhook
        position: {x: 30, y: 500}
        positionAbsolute: {x: 30, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import re
            from urllib.parse import quote

            DELIVERY_RE = re.compile(r"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$")
            REPO_RE = re.compile(r"^[A-Za-z0-9_.-]+$")

            def main(event_name: str, delivery_id: str, relay_signature_verified: str, action: str, organization: dict, repository: dict, pull_request: dict) -> dict:
                # The webhook trigger parses JSON, so the original bytes are not available for HMAC here.
                # The private relay verifies X-Hub-Signature-256 and sets the attestation header only on success.
                organization = organization if isinstance(organization, dict) else {}
                repository = repository if isinstance(repository, dict) else {}
                pull_request = pull_request if isinstance(pull_request, dict) else {}
                owner_data = repository.get("owner") if isinstance(repository.get("owner"), dict) else {}
                base_data = pull_request.get("base") if isinstance(pull_request.get("base"), dict) else {}
                head_data = pull_request.get("head") if isinstance(pull_request.get("head"), dict) else {}
                base_repo_data = base_data.get("repo") if isinstance(base_data.get("repo"), dict) else {}
                head_repo_data = head_data.get("repo") if isinstance(head_data.get("repo"), dict) else {}
                owner = owner_data.get("login", "")
                org_login = organization.get("login", "")
                repo = repository.get("name", "")
                full_name = repository.get("full_name", "")
                base = base_repo_data.get("full_name", "")
                head = head_repo_data.get("full_name", "")
                number = pull_request.get("number")
                head_ref = head_data.get("ref", "")
                head_sha = head_data.get("sha", "")
                owner = owner if isinstance(owner, str) else ""
                org_login = org_login if isinstance(org_login, str) else ""
                repo = repo if isinstance(repo, str) else ""
                full_name = full_name if isinstance(full_name, str) else ""
                base = base if isinstance(base, str) else ""
                head = head if isinstance(head, str) else ""
                head_ref = head_ref if isinstance(head_ref, str) else ""
                head_sha = head_sha if isinstance(head_sha, str) else ""
                delivery_id = delivery_id if isinstance(delivery_id, str) else ""
                action = action if isinstance(action, str) else ""
                signature_verified = relay_signature_verified == "true"
                valid = (
                    event_name == "pull_request"
                    and isinstance(delivery_id, str)
                    and DELIVERY_RE.fullmatch(delivery_id) is not None
                    and signature_verified
                    and action in {"opened", "ready_for_review"}
                    and isinstance(org_login, str)
                    and org_login.lower() == "dryvist"
                    and isinstance(owner, str)
                    and owner.lower() == "dryvist"
                    and isinstance(repo, str)
                    and REPO_RE.fullmatch(repo) is not None
                    and isinstance(full_name, str)
                    and full_name.lower() == f"dryvist/{repo}".lower()
                    and isinstance(base, str)
                    and base.lower() == full_name.lower()
                    and isinstance(head, str)
                    and head.lower() == base.lower()
                    and pull_request.get("state") == "open"
                    and pull_request.get("draft") is False
                    and isinstance(number, int)
                    and not isinstance(number, bool)
                    and number > 0
                    and isinstance(head_ref, str)
                    and bool(head_ref)
                    and isinstance(head_sha, str)
                    and re.fullmatch(r"[0-9a-f]{40}", head_sha) is not None
                )
                return {
                    "eligible": 1 if valid else 0,
                    "signature_verified": 1 if signature_verified else 0,
                    "signature_source": "relay",
                    "owner": owner,
                    "repo": repo,
                    "full_name": full_name,
                    "pull_number": number if isinstance(number, int) and not isinstance(number, bool) else 0,
                    "head_ref": head_ref,
                    "head_ref_path": quote(head_ref, safe=""),
                    "head_sha": head_sha,
                    "delivery_id": delivery_id,
                    "action": action,
                }
          code_language: python3
          desc: Verifies event identity, delivery ID shape, repository, action, and draft state.
          outputs:
            eligible: {type: number, children: null}
            signature_verified: {type: number, children: null}
            signature_source: {type: string, children: null}
            owner: {type: string, children: null}
            repo: {type: string, children: null}
            full_name: {type: string, children: null}
            pull_number: {type: number, children: null}
            head_ref: {type: string, children: null}
            head_ref_path: {type: string, children: null}
            head_sha: {type: string, children: null}
            delivery_id: {type: string, children: null}
            action: {type: string, children: null}
          selected: false
          title: Verify webhook event
          type: code
          variables:
            - {variable: event_name, value_selector: [webhook, X_GitHub_Event]}
            - {variable: delivery_id, value_selector: [webhook, X_Hub_Delivery]}
            - {variable: relay_signature_verified, value_selector: [webhook, X_Relay_Signature_Verified]}
            - {variable: action, value_selector: [webhook, action]}
            - {variable: organization, value_selector: [webhook, organization]}
            - {variable: repository, value_selector: [webhook, repository]}
            - {variable: pull_request, value_selector: [webhook, pull_request]}
        height: 54
        id: verify_event
        position: {x: 334, y: 500}
        positionAbsolute: {x: 334, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: eligible
              id: eligible
              logical_operator: and
              conditions:
                - {comparison_operator: '=', id: event-eligible, value: '1', varType: number, variable_selector: [verify_event, eligible]}
          desc: Only verified pull request events continue.
          selected: false
          title: Event gate
          type: if-else
        height: 126
        id: event_gate
        position: {x: 638, y: 500}
        positionAbsolute: {x: 638, y: 500}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      - data:
          authorization: {type: no-auth}
          body:
            type: json
            data:
              - {key: '', type: text, value: '{"role_id":"{{#env.OPENBAO_ROLE_ID#}}","secret_id":"{{#env.OPENBAO_SECRET_ID#}}"}'}
          desc: AppRole login; keep secret values in Dify environment variables.
          headers: 'Content-Type: application/json'
          method: post
          params: ''
          selected: false
          ssl_verify: true
          timeout: {connect: 10, read: 30, write: 30}
          title: OpenBao AppRole login
          type: http-request
          url: '{{#env.OPENBAO_ADDR#}}/v1/auth/approle/login'
        height: 90
        id: openbao_login
        position: {x: 942, y: 350}
        positionAbsolute: {x: 942, y: 350}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json

            def main(response_body: str) -> dict:
                try:
                    token = json.loads(response_body).get("auth", {}).get("client_token", "")
                except (TypeError, ValueError, AttributeError):
                    token = ""
                return {"client_token": token, "ready": 1 if token else 0}
          code_language: python3
          desc: Extracts the short-lived OpenBao client token.
          outputs:
            client_token: {type: string, children: null}
            ready: {type: number, children: null}
          selected: false
          title: Parse OpenBao response
          type: code
          variables:
            - {variable: response_body, value_selector: [openbao_login, body]}
        height: 54
        id: parse_openbao
        position: {x: 1246, y: 350}
        positionAbsolute: {x: 1246, y: 350}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: ready
              id: ready
              logical_operator: and
              conditions:
                - {comparison_operator: '=', id: login-ready, value: '1', varType: number, variable_selector: [parse_openbao, ready]}
          desc: Stops if OpenBao did not return a token.
          selected: false
          title: OpenBao token gate
          type: if-else
        height: 126
        id: login_ready_gate
        position: {x: 1550, y: 350}
        positionAbsolute: {x: 1550, y: 350}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: api-key
            config: {type: bearer, api_key: '{{#parse_openbao.client_token#}}', header: Authorization}
          body:
            type: json
            data:
              - {key: '', type: text, value: '{"repositories":["{{#verify_event.full_name#}}"]}'}
          desc: Requests an installation token scoped to the payload repository.
          headers: 'Content-Type: application/json'
          method: post
          params: ''
          selected: false
          ssl_verify: true
          timeout: {connect: 10, read: 30, write: 30}
          title: Mint repository-scoped GitHub token
          type: http-request
          url: '{{#env.OPENBAO_ADDR#}}{{#env.GITHUB_TOKEN_MINT_PATH#}}'
        height: 90
        id: mint_github_token
        position: {x: 1854, y: 300}
        positionAbsolute: {x: 1854, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json

            def main(response_body: str) -> dict:
                try:
                    data = json.loads(response_body)
                    token = data.get("token", data.get("installation_token", ""))
                except (TypeError, ValueError, AttributeError):
                    token = ""
                return {"token": token, "ready": 1 if token else 0}
          code_language: python3
          desc: Extracts the scoped installation token.
          outputs:
            token: {type: string, children: null}
            ready: {type: number, children: null}
          selected: false
          title: Parse GitHub token
          type: code
          variables:
            - {variable: response_body, value_selector: [mint_github_token, body]}
        height: 54
        id: parse_github_token
        position: {x: 2158, y: 300}
        positionAbsolute: {x: 2158, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: ready
              id: ready
              logical_operator: and
              conditions:
                - {comparison_operator: '=', id: token-ready, value: '1', varType: number, variable_selector: [parse_github_token, ready]}
          desc: Stops if the token broker did not return a token.
          selected: false
          title: GitHub token gate
          type: if-else
        height: 126
        id: token_ready_gate
        position: {x: 2462, y: 300}
        positionAbsolute: {x: 2462, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: api-key
            config: {type: bearer, api_key: '{{#parse_github_token.token#}}', header: Authorization}
          body: {type: none, data: []}
          desc: Reads the current PR state from the payload repository and PR number.
          headers: 'Accept: application/vnd.github+json'
          method: get
          params: ''
          selected: false
          ssl_verify: true
          timeout: {connect: 10, read: 30, write: 30}
          title: Read pull request
          type: http-request
          url: '{{#env.GITHUB_API_BASE#}}/repos/{{#verify_event.owner#}}/{{#verify_event.repo#}}/pulls/{{#verify_event.pull_number#}}'
        height: 90
        id: get_pull_request
        position: {x: 2766, y: 250}
        positionAbsolute: {x: 2766, y: 250}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            type: api-key
            config: {type: bearer, api_key: '{{#parse_github_token.token#}}', header: Authorization}
          body: {type: none, data: []}
          desc: Reads active branch rules before any review write.
          headers: 'Accept: application/vnd.github+json'
          method: get
          params: ''
          selected: false
          ssl_verify: true
          timeout: {connect: 10, read: 30, write: 30}
          title: Read branch rules
          type: http-request
          url: '{{#env.GITHUB_API_BASE#}}/repos/{{#verify_event.owner#}}/{{#verify_event.repo#}}/rules/branches/{{#verify_event.head_ref_path#}}'
        height: 90
        id: get_branch_rules
        position: {x: 3070, y: 250}
        positionAbsolute: {x: 3070, y: 250}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json

            def main(payload_head_ref: str, payload_head_sha: str, payload_repo: str, payload_number: int, current_pr_body: str, rules_body: str) -> dict:
                try:
                    pr = json.loads(current_pr_body)
                    rules = json.loads(rules_body)
                    if not isinstance(rules, list):
                        rules = rules.get("rules", []) if isinstance(rules, dict) else None
                except (TypeError, ValueError, AttributeError):
                    return {"eligible": 0}
                base_repo = pr.get("base", {}).get("repo", {}).get("full_name", "")
                head_repo = pr.get("head", {}).get("repo", {}).get("full_name", "")
                head_ref = pr.get("head", {}).get("ref", "")
                head_sha = pr.get("head", {}).get("sha", "")
                valid = (
                    isinstance(rules, list)
                    and len(rules) == 0
                    and pr.get("state") == "open"
                    and pr.get("number") == payload_number
                    and base_repo.lower() == payload_repo.lower()
                    and head_repo.lower() == base_repo.lower()
                    and head_ref == payload_head_ref
                    and head_sha == payload_head_sha
                    and head_ref not in {"main", "develop"}
                )
                return {"eligible": 1 if valid else 0}
          code_language: python3
          desc: Refuses forks, stale PR heads, closed PRs, protected refs, or unreadable rules.
          outputs:
            eligible: {type: number, children: null}
          selected: false
          title: Guard pull request and branch rules
          type: code
          variables:
            - {variable: payload_head_ref, value_selector: [verify_event, head_ref]}
            - {variable: payload_head_sha, value_selector: [verify_event, head_sha]}
            - {variable: payload_repo, value_selector: [verify_event, full_name]}
            - {variable: payload_number, value_selector: [verify_event, pull_number]}
            - {variable: current_pr_body, value_selector: [get_pull_request, body]}
            - {variable: rules_body, value_selector: [get_branch_rules, body]}
        height: 54
        id: guard_pull_request
        position: {x: 3374, y: 250}
        positionAbsolute: {x: 3374, y: 250}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: eligible
              id: eligible
              logical_operator: and
              conditions:
                - {comparison_operator: '=', id: pr-eligible, value: '1', varType: number, variable_selector: [guard_pull_request, eligible]}
          desc: Blocks all review writes unless the payload and current PR still match.
          selected: false
