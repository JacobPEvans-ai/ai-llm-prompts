      - data:
          code: |-
            import json
            import re

            SECRET_RE = re.compile(r"(?i)(?:-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{30,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|(?:api[_-]?key|secret|token)\s*[:=]\s*['\"]?[A-Za-z0-9_./+=-]{24,})")

            def main(model_text: str, changed_files_json: str) -> dict:
                generic = "No concrete behavior-preserving simplification was established."
                try:
                    result = json.loads(model_text)
                    changed = {item["path"]: set(item["lines"]) for item in json.loads(changed_files_json)}
                except (TypeError, ValueError, KeyError):
                    result, changed = {}, {}
                comments = result.get("comments", []) if isinstance(result, dict) else []
                decision = result.get("decision") if isinstance(result, dict) else None
                body = result.get("review_body", "") if isinstance(result, dict) else ""
                if decision == "refuse" or not isinstance(body, str) or not body or SECRET_RE.search(body):
                    body = generic
                    comments = []
                valid_comments = []
                if isinstance(comments, list) and len(comments) <= 5:
                    for comment in comments:
                        if not isinstance(comment, dict):
                            continue
                        path = comment.get("path")
                        line = comment.get("line")
                        start = comment.get("start_line", line)
                        text = comment.get("body", "")
                        if path not in changed or not isinstance(line, int) or not isinstance(start, int) or start > line:
                            continue
                        if line not in changed[path] or start not in changed[path] or not isinstance(text, str) or SECRET_RE.search(text):
                            continue
                        suggestion = re.search(r"```suggestion\s*\n(.*?)\n```", text, re.S)
                        if text.count("```suggestion") != 1 or not suggestion or len(suggestion.group(1).splitlines()) > 20:
                            continue
                        if any(number not in changed[path] for number in range(start, line + 1)):
                            continue
                        valid_comments.append({"path": path, "start_line": start, "line": line, "side": "RIGHT", "body": text})
                if len({comment["path"] for comment in valid_comments}) > 5:
                    valid_comments = []
                request = {"event": "COMMENT", "body": body, "comments": valid_comments}
                return {"event": "COMMENT", "request_json": json.dumps(request, ensure_ascii=False)}
          code_language: python3
          desc: Forces COMMENT and accepts only changed-line suggestions of at most 20 lines.
