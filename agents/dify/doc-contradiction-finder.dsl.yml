            def main(event: str, action: str, merged: str, org: str, repo: str, pr_number: int) -> dict:
                valid = (
                    event == "pull_request"
                    and action == "closed"
                    and str(merged).lower() == "true"
                    and isinstance(org, str)
                    and org.lower() == "dryvist"
                    and isinstance(repo, str)
