      - data:
          code: |-
            import json
            import re

            SEVERITIES = {"S1", "S2", "S3", "S4"}
            FINDING_KEYS = {"severity", "fingerprint", "statements", "question", "ask"}
            STATEMENT_KEYS = {"page_path", "line", "quote"}
            FINGERPRINT_RE = re.compile(r"^[a-z0-9][a-z0-9:/._-]{0,190}$")

            def normalized(text):
                # Same normalization on both sides of the quote check: each run of whitespace becomes one space.
                return " ".join(text.split())

            import ipaddress
            import re

            # The one redaction rule. The finder validator applies it to each quote and to the cited page text before the verbatim
            # check, so a quote that the prompt redacted still matches its page. A credential keeps its label and loses its value.
            SECRET_RE = re.compile(
                r"(?i)(?:(?P<label>(?:api[_-]?key|secret|token)\s*[:=]\s*['\"]?)[A-Za-z0-9_./+=-]{24,}"
                r"|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{30,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})"
            )
            SECRET_KEY_RE = re.compile(r"(?i)(?:api[_-]?key|token|authorization|password|secret|cookie)")
            HOST_RE = re.compile(r"(?i)\b(?:[A-Z0-9](?:[A-Z0-9-]{0,61}[A-Z0-9])?\.)+[A-Z]{2,63}\b")
            FILE_EXTENSIONS = {"md", "py", "ts", "tsx", "js", "jsx", "json", "yaml", "yml", "toml", "txt", "html", "css"}
            # md and py are also country-code TLDs, so only a two-label name such as README.md stays a file reference.
            # shortcut: a two-label host under .md or .py (corp.md) stays unredacted; upgrade to a page-path allowlist if one appears.
            CCTLD_EXTENSIONS = {"md", "py"}
            IPV4_RE = re.compile(r"(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])")
            IPV6_RE = re.compile(r"(?<![A-Fa-f0-9:])[A-Fa-f0-9:]{2,}(?![A-Fa-f0-9:])")
            REDACTED = "[REDACTED]"
            MAX_IPV6_LEN = 45  # longest textual IPv6 form (IPv4-mapped, no zone)


            def _is_address(candidate):
                if IPV4_RE.fullmatch(candidate):
                    # ipaddress rejects leading zeros, so read each octet as decimal first.
                    candidate = ".".join(str(int(octet)) for octet in candidate.split("."))
                try:
                    ipaddress.ip_address(candidate)
                    return True
                except ValueError:
                    return False


            def _redact_ipv6(match):
                candidate = match.group(0)
                if ":" not in candidate:
                    return candidate
                # Prose can touch an address on either side ("Peer:2001:db8::1", "2001:db8::: is down", "ab2001:db8::1"); scan the
                # run left to right, redact the longest address at the leftmost start, and keep the text around it.
                parts, pos = [], 0
                while pos < len(candidate):
                    span = _first_address_span(candidate, pos)
                    if span is None:
                        break
                    parts += [candidate[pos : span[0]], REDACTED]
                    pos = span[1]
                return "".join(parts) + candidate[pos:]


            def _first_address_span(candidate, pos):
                for start in range(pos, len(candidate)):
                    for end in range(min(len(candidate), start + MAX_IPV6_LEN), start + 1, -1):
                        span = candidate[start:end]
                        if ":" in span and _is_address(span):
                            return start, end
                return None


            def _redact_host(match):
                name = match.group(0)
                labels = name.lower().split(".")
                if labels[-1] in FILE_EXTENSIONS and (labels[-1] not in CCTLD_EXTENSIONS or len(labels) == 2):
                    return name
                return REDACTED


            def redact(text):
                if isinstance(text, dict):
                    return {key: REDACTED if SECRET_KEY_RE.fullmatch(key) else redact(value) for key, value in text.items()}
                if isinstance(text, list):
                    return [redact(value) for value in text]
                if not isinstance(text, str):
                    return text
                text = SECRET_RE.sub(lambda match: (match.group("label") or "") + REDACTED, text)
                text = IPV4_RE.sub(lambda match: REDACTED if _is_address(match.group(0)) else match.group(0), text)
                text = IPV6_RE.sub(_redact_ipv6, text)
                return HOST_RE.sub(_redact_host, text)


            def needs_redaction(text):
                return REDACTED in text or redact(text) != text
            def strip_json_fence(text):
                # Remove one surrounding Markdown fence (```json or a bare ```) from model output. Only ASCII spaces, tabs, and
                # line breaks count as whitespace, so the JavaScript mirror trims the same characters. Text without a surrounding
                # fence is returned unchanged.
                value = str(text)
                stripped = value.strip(" \t\r\n")
                if len(stripped) >= 6 and stripped.startswith("```") and stripped.endswith("```"):
                    body = stripped[3:-3].strip(" \t\r\n")
                    if body[:4].lower() == "json":
                        body = body[4:].strip(" \t\r\n")
                    return body
                return value
            def main(model_text: str, page_paths_json: str, known_fingerprints_json: str, page_texts_json: str) -> dict:
                if not isinstance(model_text, str) or not model_text.strip():
                    return {"findings_json": ""}
                try:
                    result = json.loads(strip_json_fence(model_text))
                    page_paths = set(json.loads(page_paths_json))
                    known = set(json.loads(known_fingerprints_json))
                    texts = json.loads(page_texts_json)
                except (TypeError, ValueError):
                    return {"findings_json": ""}
                if not isinstance(texts, dict):
                    return {"findings_json": ""}
                if not isinstance(result, dict) or set(result) != {"findings"} or not isinstance(result["findings"], list):
                    return {"findings_json": ""}
                findings = []
                for finding in result["findings"]:
                    if not isinstance(finding, dict) or set(finding) != FINDING_KEYS:
                        return {"findings_json": ""}
                    severity, fingerprint, statements = finding["severity"], finding["fingerprint"], finding["statements"]
                    question, ask = finding["question"], finding["ask"]
                    if (severity not in SEVERITIES or not isinstance(fingerprint, str)
                        or FINGERPRINT_RE.fullmatch(fingerprint) is None
                        or not isinstance(statements, list) or not 1 <= len(statements) <= 6
                        or not isinstance(question, str) or not question.startswith("Which is right?")
                        or not all(marker in question for marker in ("A:", "B:", "Neither:"))
                        or not isinstance(ask, bool)):
                        return {"findings_json": ""}
                    safe_statements = []
                    for statement in statements:
                        if not isinstance(statement, dict) or set(statement) != STATEMENT_KEYS:
                            return {"findings_json": ""}
                        path, line, quote = statement["page_path"], statement["line"], statement["quote"]
                        if (not isinstance(path, str) or path not in page_paths or "://" in path
                            or ".." in path.split("/")
                            or not isinstance(line, int) or isinstance(line, bool) or line < 1
                            or not isinstance(texts.get(path), str)
                            or not isinstance(quote, str) or not quote.strip() or len(quote) > 300):
                            return {"findings_json": ""}
                        safe_statements.append({"page_path": path, "line": line, "quote": quote})
                    if not all(normalized(redact(s["quote"])) in normalized(redact(texts[s["page_path"]])) for s in safe_statements):
                        continue  # A quote that is not verbatim in its redacted cited page drops only this finding.
                    header = "\n".join([fingerprint, question] + [s["page_path"] for s in safe_statements])
                    if redact(header) != header:
                        return {"findings_json": ""}
                    security = any(needs_redaction(s["quote"]) for s in safe_statements)
                    findings.append({
                        "severity": severity,
                        "fingerprint": fingerprint,
                        "statements": [dict(s, quote=redact(s["quote"])) for s in safe_statements],
                        "question": question,
                        # A finding whose quote needed redaction is a security finding: it goes to Zammad, never to Slack.
                        "security": security,
                        # Dedupe is enforced here as well as in the prompt: a tracked fingerprint is never asked again.
                        "ask": ask and fingerprint not in known and not security,
                    })
                return {"findings_json": json.dumps({"findings": findings}, ensure_ascii=False)}
          code_language: python3
          desc: Accepts only schema-valid findings whose pages were supplied. Quotes are redacted with the shared rule and must match their redacted cited page verbatim. A finding whose quote needed redaction is marked security and is never asked.
          outputs:
            findings_json:
              children: null
              type: string
          selected: false
          title: Validate contradiction findings
          type: code
          variables:
            - value_selector:
                - docs_updater_llm
                - text
              variable: model_text
            - value_selector:
                - prepare_context
                - page_paths_json
              variable: page_paths_json
            - value_selector:
                - prepare_context
                - known_fingerprints_json
              variable: known_fingerprints_json
            - value_selector:
                - prepare_context
                - page_texts_json
              variable: page_texts_json
