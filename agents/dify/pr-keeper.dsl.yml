        position:
          x: 1260
          "y": 60
        type: custom
      - data:
          code: |-
            import json

            STATES = {
                "behind": "update-branch",
                "conflicted": "label merge-conflict + fix",
                "checks_red": "fix",
                "review_changes": "fix",
                "needs_reviewer": "request reviewer",
                "ready_to_merge": "hand to merge-steward",
                "held": "one line for the lead",
                "pending": "none",
                "error": "none",
            }
            RED_CONCLUSIONS = {"failure", "error", "timed_out", "action_required", "cancelled", "stale"}
            OK_CONCLUSIONS = {"success", "neutral", "skipped"}

            def decode(raw):
                try:
                    return json.loads(raw)
                except (TypeError, ValueError):
                    return None

            def build_record(repository, pr_number, head_sha, state, detail, shadow):
                return {
                    "repository": repository,
                    "pr_number": int(pr_number),
                    "head_sha": head_sha,
                    "state": state,
                    "action": STATES[state],
                    "shadow": shadow,
                    "attempt": 0,
                    "detail": detail,
                }

            def main(repository: str, pr_number: int, pull_status_code: int, pull_body: str,
                     head_sha: str, checks_status_code: int, checks_body: str,
                     commit_status_code: int, commit_status_body: str,
                     reviews_status_code: int, reviews_body: str, shadow_mode: str) -> dict:
                shadow = shadow_mode == "true"

                def record(repository, pr_number, head_sha, state, detail):
                    return build_record(repository, pr_number, head_sha, state, detail, shadow)

                failed_reads = [
                    ("pull request details", pull_status_code),
                    ("head check runs", checks_status_code),
                    ("head commit status", commit_status_code),
                    ("pull request reviews", reviews_status_code),
                ]
                failed_reads = [(endpoint, status) for endpoint, status in failed_reads if status != 200]
                if failed_reads:
                    detail = "; ".join(f"GitHub returned HTTP {status} for {endpoint}." for endpoint, status in failed_reads)
                    return {"result": record(repository, pr_number, head_sha, "error", detail)}
                pull = decode(pull_body) if pull_status_code == 200 else None
                if not isinstance(pull, dict):
                    return {"result": record(repository, pr_number, head_sha, "pending", "Pull request details are unavailable.")}
                head = pull.get("head", {})
                resolved_sha = head.get("sha", "") if isinstance(head, dict) else ""
                resolved_sha = resolved_sha if isinstance(resolved_sha, str) else ""
                if not resolved_sha:
                    return {"result": record(repository, pr_number, "", "pending", "Pull request head SHA is unavailable.")}

                mergeable_state = pull.get("mergeable_state")
                mergeable = pull.get("mergeable")
                if mergeable_state == "behind":
                    return {"result": record(repository, pr_number, resolved_sha, "behind", "The head branch is behind its base branch.")}
                if mergeable_state in {"dirty", "conflicting"}:
                    return {"result": record(repository, pr_number, resolved_sha, "conflicted", "GitHub reports a merge conflict.")}
                if pull.get("draft") is True or mergeable_state == "blocked":
                    return {"result": record(repository, pr_number, resolved_sha, "held", "The pull request is draft or blocked.")}
                if mergeable is False:
                    return {"result": record(repository, pr_number, resolved_sha, "conflicted", "GitHub reports a merge conflict.")}

                checks_data = decode(checks_body) if checks_status_code == 200 else None
                commit_data = decode(commit_status_body) if commit_status_code == 200 else None
                reviews = decode(reviews_body) if reviews_status_code == 200 else None
                if not isinstance(checks_data, dict) or not isinstance(checks_data.get("check_runs"), list):
                    return {"result": record(repository, pr_number, resolved_sha, "pending", "Check run evidence is unavailable.")}
                if not isinstance(commit_data, dict) or not isinstance(commit_data.get("state"), str):
                    return {"result": record(repository, pr_number, resolved_sha, "pending", "Commit status evidence is unavailable.")}
                if not isinstance(reviews, list):
                    return {"result": record(repository, pr_number, resolved_sha, "pending", "Review evidence is unavailable.")}

                check_runs = checks_data["check_runs"]
                conclusions = [run.get("conclusion") for run in check_runs if isinstance(run, dict)]
                commit_state = commit_data["state"].lower()
                statuses = commit_data.get("statuses", [])
                status_states = [item.get("state", "").lower() for item in statuses if isinstance(item, dict)] if isinstance(statuses, list) else []
                pending_status = any(value == "pending" for value in status_states)
                total_status_count = commit_data.get("total_count")
                combined_status_pending = (
                    commit_state == "pending"
                    and isinstance(total_status_count, int)
                    and total_status_count > 0
                )
                if any(value in RED_CONCLUSIONS for value in conclusions) or commit_state in {"failure", "error"} or any(value in {"failure", "error"} for value in status_states):
                    return {"result": record(repository, pr_number, resolved_sha, "checks_red", "A check run or commit status reports failure.")}

                latest_reviews = {}
                for review in reviews:
                    if not isinstance(review, dict):
                        continue
                    user = review.get("user") if isinstance(review.get("user"), dict) else {}
                    reviewer_id = user.get("id") or user.get("login") or review.get("id")
                    if reviewer_id is not None:
                        reviewer_key = str(reviewer_id)
                        review_state = str(review.get("state", "")).upper()
                        if review_state in {"APPROVED", "CHANGES_REQUESTED"}:
                            latest_reviews[reviewer_key] = review_state
                        elif review_state == "DISMISSED":
                            latest_reviews.pop(reviewer_key, None)
                if "CHANGES_REQUESTED" in latest_reviews.values():
                    return {"result": record(repository, pr_number, resolved_sha, "review_changes", "A current review requests changes.")}

                pending_checks = (
                    any(
                        not isinstance(run, dict)
                        or run.get("status") != "completed"
                        or run.get("conclusion") not in OK_CONCLUSIONS | RED_CONCLUSIONS
                        for run in check_runs
                    )
                    or pending_status
                    or combined_status_pending
                )
                if pending_checks:
                    return {"result": record(repository, pr_number, resolved_sha, "pending", "Checks are still pending or have an unknown conclusion.")}
                if mergeable is not True:
                    return {"result": record(repository, pr_number, resolved_sha, "pending", "GitHub has not confirmed that the pull request is mergeable.")}
                if not any(state == "APPROVED" for state in latest_reviews.values()):
                    requested = pull.get("requested_reviewers", [])
                    if isinstance(requested, list) and requested:
                        return {"result": record(repository, pr_number, resolved_sha, "pending", "A requested reviewer has not submitted an approval.")}
                    return {"result": record(repository, pr_number, resolved_sha, "needs_reviewer", "No current approval is present.")}
                if mergeable_state != "clean":
                    return {"result": record(repository, pr_number, resolved_sha, "pending", "GitHub has not reported a clean merge state.")}
                return {"result": record(repository, pr_number, resolved_sha, "ready_to_merge", "Observed checks passed and a current approval is present.")}
