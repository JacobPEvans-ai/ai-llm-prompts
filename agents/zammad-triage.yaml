name: zammad-triage
extends: local-batch
description: |
  Use when: a ticket webhook or rotation catch-up needs scoped ranking.
  Do not use when: the request needs ticket closure, reassignment, or customer replies.
connectors: [zammad-clerk]
tools: [zammad_rest.search, zammad_rest.update_priority, zammad_rest.add_tag, zammad_rest.internal_note]
model_policy: {locality: local_only, cloud_fallback: forbidden, router_key_ref: openbao://agent-key/zammad-triage}
triggers:
  - kind: event
    source: zammad
  - kind: rotation
    every: 1h
    minute: 33
reader: Zammad via zammad-clerk
acted_signal: ticket state changes
memory_scope: hindsight/zammad-triage
identity: agent-zammad-triage
api_key_ref: openbao://agent-key/zammad-triage
mandate_binding:
  kind: fixed_in_app
  source: environment_and_policy_refs
  schedule_inputs: {}
  model_writable: false
  immutable: true
capabilities:
  rank: {field: priority_id, values: {low: 1, normal: 2, high: 3}}
  tag: {operation: add_only, vocabulary: ZAMMAD_TRIAGE_TAG_VOCABULARY}
  note: {type: note, internal: true, content_type: text/plain, body_template: "Triage (automated): proposed priority <low|normal|high>; reason <REASON_CODE>.", reason_codes: [blocked, stale, explicit_priority, duplicate_candidate, needs_owner]}
  incident: {kind: propose_incident, reason: incident_candidate, dispatch: false, note_reason_forbidden: true}
  forbidden: [create, close, state_change, delete, merge, reassign_owner, group_move, customer_visible_article, email_reply, tag_remove, priority_on_readonly_group]
policies:
  allowed_groups_ref: policy://zammad-triage/allowed-groups
  readonly_groups_ref: policy://zammad-triage/readonly-groups
  denied_groups_ref: policy://zammad-triage/denied-groups
  deny_wins: true
  default_group: deny_reads_and_writes
  unfiltered_search: refuse
  search_scope: allowed_union_readonly_minus_denied
  client_groups: always_denied
  refs_are_opaque: true
  environment:
    allowed_groups: ZAMMAD_TRIAGE_ALLOWED_GROUPS
    readonly_groups: ZAMMAD_TRIAGE_READONLY_GROUPS
    denied_groups: ZAMMAD_TRIAGE_DENIED_GROUPS
    mode: ZAMMAD_TRIAGE_MODE
    tag_vocabulary: ZAMMAD_TRIAGE_TAG_VOCABULARY
guards:
  enforce_before_dispatch: true
  deny_unknown_kinds_fields_and_operations: true
  drop_actions_on_readonly_or_out_of_scope: true
  drop_tags_outside_vocabulary: true
  max_actions_per_run: 20
  incident_proposals_never_dispatched: true
  shadow_mode: {dispatch_writes: false, return_intended_actions: true}
  live_writes: {hard_disabled: true, enable_after: executable_injection_eval_in_dsl_tests}
  on_write_error: abort_and_deny_remaining_plan
  on_error: deny
delivery:
  kind: slack_thread
  channel_env: AGENT_DIGEST_CHANNEL
  token_env: SLACK_AGENT_BOT_TOKEN
  failure_channel_env: AGENT_FAILURE_CHANNEL
  dashboard_url_env: AGENT_DASHBOARD_URL
  max_chars: 3000
  thread: daily_parent
  input_from: [fetch, refs]
  error_from: [fetch, fetch_error]
dify:
  app: {description: 'Scheduled, policy-scoped Zammad triage with guarded shadow and live branches.', mode: workflow, name: __DIFY_AGENT_NAME__}
  dependencies: []
  kind: app
  version: 0.7.0
  workflow:
    environment_variables:
    - {id: allowed, name: ZAMMAD_TRIAGE_ALLOWED_GROUPS, value_type: secret, value: '[]'}
    - {id: readonly, name: ZAMMAD_TRIAGE_READONLY_GROUPS, value_type: secret, value: '[]'}
    - {id: denied, name: ZAMMAD_TRIAGE_DENIED_GROUPS, value_type: secret, value: '[]', description: Include all client and
        business group IDs}
    - {id: tags, name: ZAMMAD_TRIAGE_TAG_VOCABULARY, value_type: secret, value: '[]'}
    - {id: mode, name: ZAMMAD_TRIAGE_MODE, value_type: string, value: __DIFY_MODE__, description: Only exact live enables
        writes}
    - {id: api_base, name: ZAMMAD_API_BASE, value_type: string, value: ''}
    - {id: bao_addr, name: OPENBAO_ADDR, value_type: string, value: ''}
    - {id: bao_role, name: OPENBAO_ROLE_ID, value_type: secret, value: ''}
    - {id: bao_secret, name: OPENBAO_SECRET_ID, value_type: secret, value: ''}
    - {id: token_path, name: ZAMMAD_TOKEN_PATH, value_type: string, value: ''}
    - {id: router_key, name: LITELLM_ROUTER_KEY, value_type: secret, value: '', description: LiteLLM router key; it must be
        scoped to local-only models and forbid cloud fallback}
    graph:
      edges:
      - data: {sourceType: trigger-schedule, targetType: code}
        id: e1
        source: schedule
        sourceHandle: source
        target: fetch
        targetHandle: target
        type: custom
      - data: {sourceType: code, targetType: if-else}
        id: e2
        source: fetch
        sourceHandle: source
        target: fetch_gate
        targetHandle: target
        type: custom
      - data: {sourceType: if-else, targetType: llm}
        id: e3
        source: fetch_gate
        sourceHandle: tickets
        target: triage
        targetHandle: target
        type: custom
      - data: {sourceType: if-else, targetType: end}
        id: e4
        source: fetch_gate
        sourceHandle: error
        target: failed-fetch
        targetHandle: target
        type: custom
      - data: {sourceType: if-else, targetType: end}
        id: e5
        source: fetch_gate
        sourceHandle: 'false'
        target: fetch-empty
        targetHandle: target
        type: custom
      - data: {sourceType: llm, targetType: code}
        id: e6
        source: triage
        sourceHandle: source
        target: guard
        targetHandle: target
        type: custom
      - data: {sourceType: code, targetType: end}
        id: e7
        source: guard
        sourceHandle: source
        target: done
        targetHandle: target
        type: custom
      nodes:
      - data: {mode: cron, cron_expression: __DIFY_TRIGGER_CRON__, timezone: UTC, title: Schedule, type: trigger-schedule}
        id: schedule
        position: {x: 40, y: 300}
        type: custom
      - data:
          code: |-
            import json,re,urllib.request
            from datetime import datetime,timezone
            from urllib.parse import urlencode,urlsplit
            __DIFY_HELPER_REDACT__
            class NR(urllib.request.HTTPRedirectHandler):
                def redirect_request(self,*a,**k): return None
            def req(u,m='GET',h=None,b=None):
                with urllib.request.build_opener(NR).open(urllib.request.Request(u,data=b,headers=h or {},method=m),timeout=15) as r: return json.loads(r.read().decode())
            def https(s):
                u=urlsplit(s); return u.scheme=='https' and u.hostname and not (u.username or u.password or u.query or u.fragment)
            def token(a,r,s,p):
                if not https(a) or not p or '..' in p.split('/'): raise ValueError()
                c=req(a.rstrip('/')+'/v1/auth/approle/login','POST',{'Content-Type':'application/json'},json.dumps({'role_id':r,'secret_id':s}).encode())['auth']['client_token']
                d=req(a.rstrip('/')+'/v1/'+p.strip('/'),h={'X-Vault-Token':c})['data']; t=d.get('token') or d.get('data',{}).get('token')
                if not isinstance(t,str) or not t: raise ValueError()
                return t
            def ids(s):
                v=json.loads(s)
                if not isinstance(v,list) or any(type(x)!=str or not x.strip() for x in v): raise ValueError()
                return set(v)
            def age(v,n):
                try:
                    d=datetime.fromisoformat(str(v).replace('Z','+00:00')); d=d if d.tzinfo else d.replace(tzinfo=timezone.utc)
                    return max(0,(n-d).days)
                except Exception: return None
            def main(allowed,readonly,denied,tags,base,addr,role,secret,path,stamp):
                # state: tickets (refs non-empty), empty (clean search, no tickets), error (any failure; ok false).
                bad={'pol':'{"ok":false}','refs':'[]','model':'[]','ok':False,'state':'error','fetch_error':'policy or ticket search error'}
                try:
                    a,r,d,t=map(ids,(allowed,readonly,denied,tags))
                    p={'ok':True,'allowed':sorted(a),'readonly':sorted(r),'denied':sorted(d),'read':sorted((a|r)-d),'write':sorted(a-r-d),'tags':sorted(t)}
                    if not p['read'] or not https(base): return bad
                    n=datetime.fromisoformat(stamp.replace('Z','+00:00')); n=n if n.tzinfo else n.replace(tzinfo=timezone.utc)
                    tk=token(addr,role,secret,path); refs=[]
                    for g in p['read']:
                        raw=req(base.rstrip('/')+'/api/v1/tickets/search?'+urlencode({'query':'group_id:'+g,'limit':'50','expand':'true'}),h={'Authorization':'Token token='+tk})
                        xs=raw if isinstance(raw,list) else raw.get('tickets') if isinstance(raw,dict) else None
                        if not isinstance(xs,list): return bad
                        for x in xs:
                            i=str(x.get('id','')) if isinstance(x,dict) else ''
                            if not re.fullmatch(r'[0-9]+',i): return bad
                            if str(x.get('group_id'))!=g: continue
                            s=x.get('state',''); s=s.get('name','') if isinstance(s,dict) else s
                            tg=x.get('tags',[]); tg=tg.split() if isinstance(tg,str) else tg
                            try: pri={1:'low',2:'normal',3:'high'}.get(int(x.get('priority_id')))
                            except Exception: pri=None
                            refs.append({'ticket_index':len(refs),'id':i,'group_id':g,'title':str(x.get('title','')),'priority':pri,'state':s if isinstance(s,str) else '','age_days':age(x.get('created_at'),n),'tags':[v for v in tg if isinstance(v,str)] if isinstance(tg,list) else [],'last_updated_age_days':age(x.get('updated_at'),n)})
                    model=[{k:v for k,v in x.items() if k not in ('id','group_id')} for x in refs]
                    return {'pol':json.dumps(p),'refs':json.dumps(refs),'model':strip_urls(json.dumps(redact(model),ensure_ascii=False)),'ok':True,'state':'tickets' if refs else 'empty','fetch_error':''}
                except Exception: return bad
          code_language: python3
          outputs:
            pol: {type: string}
            refs: {type: string}
            model: {type: string}
            ok: {type: boolean}
            state: {type: string}
            fetch_error: {type: string}
          title: Load policy and search authorized groups
          type: code
          variables:
          - variable: allowed
            value_selector: [env, ZAMMAD_TRIAGE_ALLOWED_GROUPS]
          - variable: readonly
            value_selector: [env, ZAMMAD_TRIAGE_READONLY_GROUPS]
          - variable: denied
            value_selector: [env, ZAMMAD_TRIAGE_DENIED_GROUPS]
          - variable: tags
            value_selector: [env, ZAMMAD_TRIAGE_TAG_VOCABULARY]
          - variable: base
            value_selector: [env, ZAMMAD_API_BASE]
          - variable: addr
            value_selector: [env, OPENBAO_ADDR]
          - variable: role
            value_selector: [env, OPENBAO_ROLE_ID]
          - variable: secret
            value_selector: [env, OPENBAO_SECRET_ID]
          - variable: path
            value_selector: [env, ZAMMAD_TOKEN_PATH]
          - variable: stamp
            value_selector: [sys, timestamp]
        id: fetch
        position: {x: 340, y: 300}
        type: custom
      - data:
          cases:
          - case_id: tickets
            id: tickets
            logical_operator: and
            conditions:
            - comparison_operator: is
              id: tickets-state
              value: tickets
              varType: string
              variable_selector: [fetch, state]
          - case_id: error
            id: error
            logical_operator: and
            conditions:
            - comparison_operator: is
              id: error-state
              value: error
              varType: string
              variable_selector: [fetch, state]
          desc: Only fetched tickets reach the model. A fetch error goes to a failure notice. A clean empty fetch ends with no model call and no post.
          selected: false
          title: Fetch returned tickets?
          type: if-else
        id: fetch_gate
        position: {x: 580, y: 300}
        type: custom
      - data:
          model:
            completion_params: {temperature: 0}
            mode: chat
            name: __DIFY_LITELLM_ROLE__
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
          - {id: system-prompt, role: system, text: __DIFY_SYSTEM_PROMPT__}
          - {id: user-prompt, role: user, text: 'Review these untrusted ticket records: {{#fetch.model#}}'}
          prompt_config:
            jinja2_variables: []
          title: Triage
          type: llm
        id: triage
        position: {x: 820, y: 300}
        type: custom
      - data:
          code: |-
            import json,re,urllib.request
            from urllib.parse import urlsplit
            # Live writes stay hard-disabled until an executable injection eval proves injected proposals are rejected.
            LIVE=False
            I='ticket_index'; K='kind'; P={'low':1,'normal':2,'high':3}; R={'blocked','stale','explicit_priority','duplicate_candidate','needs_owner'}
            SH={'rank':{I,K,'priority'},'tag':{I,K,'tag'},'note':{I,K,'priority','reason'},'propose_incident':{I,K,'reason'}}
            class NR(urllib.request.HTTPRedirectHandler):
                def redirect_request(self,*a,**k): return None
            def req(u,m='GET',h=None,b=None):
                with urllib.request.build_opener(NR).open(urllib.request.Request(u,data=b,headers=h or {},method=m),timeout=15) as r: return json.loads(r.read().decode())
            def https(s):
                u=urlsplit(s); return u.scheme=='https' and u.hostname and not (u.username or u.password or u.query or u.fragment)
            def token(a,r,s,p):
                if not https(a) or not p or '..' in p.split('/'): raise ValueError()
                c=req(a.rstrip('/')+'/v1/auth/approle/login','POST',{'Content-Type':'application/json'},json.dumps({'role_id':r,'secret_id':s}).encode())['auth']['client_token']
                d=req(a.rstrip('/')+'/v1/'+p.strip('/'),h={'X-Vault-Token':c})['data']; t=d.get('token') or d.get('data',{}).get('token')
                if not isinstance(t,str) or not t: raise ValueError()
                return t
            def bind(a,r):
                k=a[K]; i=r['id']
                if k=='rank': return 'PUT','/api/v1/tickets/'+i,{'priority_id':P[a['priority']]}
                if k=='tag': return 'POST','/api/v1/tags/add',{'object':'Ticket','o_id':int(i),'item':a['tag']}
                body='Triage (automated): proposed priority '+a['priority']+'; reason '+a['reason']+'.'
                return 'POST','/api/v1/ticket_articles',{'ticket_id':int(i),'type':'note','internal':True,'content_type':'text/plain','body':body}
            __DIFY_HELPER_JSON_FENCE__
            def esc(s): return s.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')
            def count(s):
                try: return len(json.loads(s))
                except Exception: return 0
            def digest(actions,by,tickets):
                # Built only from validated ids, allowlisted kinds, priorities and reason codes, and vocabulary tags. Never ticket titles or bodies.
                rows={}
                for a in actions:
                    row=rows.setdefault(a[I],{'priority':'-','tags':[],'reason':'-'})
                    if a[K] in ('rank','note'): row['priority']=a['priority']
                    if a[K]=='tag': row['tags'].append(a['tag'])
                    if a[K] in ('note','propose_incident'): row['reason']=a['reason']
                lines=[f"zammad-triage shadow: {len(actions)} proposed actions; {tickets} tickets reviewed; no writes"]
                lines+=[f"ticket #{by[i]['id']}: priority {row['priority']}; tags {','.join(row['tags']) or '-'}; reason {row['reason']}" for i,row in rows.items()]
                return esc('\n'.join(lines))
            def main(text,refs,pol,ok,mode,base,addr,role,secret,path):
                mode='live' if LIVE and mode=='live' else 'shadow'; tickets=count(refs)
                refused=esc(f"zammad-triage shadow: model output refused by guard; 0 proposed actions; {tickets} tickets reviewed; no writes")
                empty={'actions':'[]','results':'[]','mode':mode,'digest':refused}
                try:
                    p=json.loads(pol); by={r[I]:r for r in json.loads(refs)}; obj=json.loads(strip_json_fence(text))
                    if not ok or not p.get('ok') or not isinstance(obj,dict) or set(obj)!={'actions'} or not isinstance(obj['actions'],list) or len(obj['actions'])>20: return empty
                    for a in obj['actions']:
                        if not isinstance(a,dict) or a.get(K) not in SH or set(a)!=SH[a[K]] or type(a[I]) is not int or a[I] not in by: return empty
                        if a[K] in ('rank','note') and a['priority'] not in P or a[K]=='note' and a['reason'] not in R: return empty
                        if a[K]=='propose_incident' and a['reason']!='incident_candidate' or a[K]=='tag' and type(a['tag'])!=str: return empty
                    proposals={a[I] for a in obj['actions'] if a[K]=='propose_incident'}; actions=[]; plan=[]
                    writable=set(p['allowed'])-set(p['readonly'])-set(p['denied'])
                    for a in obj['actions']:
                        i,k=a[I],a[K]; r=by[i]; g=r['group_id']
                        if g not in p['read'] or g in p['readonly']: continue
                        if k=='propose_incident': actions.append(a); continue
                        if g not in writable or i in proposals or k=='tag' and a['tag'] not in p['tags'] or not re.fullmatch(r'[0-9]+',r['id']): continue
                        actions.append(a); plan.append(bind(a,r))
                    out=[]
                    if mode=='live' and plan and https(base):
                        tk=token(addr,role,secret,path); h={'Authorization':'Token token='+tk,'Content-Type':'application/json'}
                        for n,(m,u,b) in enumerate(plan):
                            try: req(base.rstrip('/')+u,m,h,json.dumps(b).encode()); out.append({'ok':True,'path':u})
                            except Exception:
                                out+=[{'ok':False,'path':u}]+[{'ok':False,'path':x[1],'denied':True} for x in plan[n+1:]]; break
                    return {'actions':json.dumps(actions),'results':json.dumps(out),'mode':mode,'digest':digest(actions,by,len(by))}
                except Exception: return empty
          code_language: python3
          outputs:
            actions: {type: string}
            results: {type: string}
            mode: {type: string}
            digest: {type: string}
          title: Guard and dispatch
          type: code
          variables:
          - variable: text
            value_selector: [triage, text]
          - variable: refs
            value_selector: [fetch, refs]
          - variable: pol
            value_selector: [fetch, pol]
          - variable: ok
            value_selector: [fetch, ok]
          - variable: mode
            value_selector: [env, ZAMMAD_TRIAGE_MODE]
          - variable: base
            value_selector: [env, ZAMMAD_API_BASE]
          - variable: addr
            value_selector: [env, OPENBAO_ADDR]
          - variable: role
            value_selector: [env, OPENBAO_ROLE_ID]
          - variable: secret
            value_selector: [env, OPENBAO_SECRET_ID]
          - variable: path
            value_selector: [env, ZAMMAD_TOKEN_PATH]
        id: guard
        position: {x: 1120, y: 300}
        type: custom
      - data:
          outputs:
          - variable: text
            value_selector: [guard, digest]
          - variable: actions
            value_selector: [guard, actions]
          - variable: mode
            value_selector: [guard, mode]
          - variable: results
            value_selector: [guard, results]
          title: Output
          type: end
        id: done
        position: {x: 1420, y: 300}
        type: custom
      - data:
          outputs:
          - variable: state
            value_selector: [fetch, state]
          title: No tickets fetched
          type: end
        id: fetch-empty
        position: {x: 820, y: 120}
        type: custom
      - data:
          outputs:
          - variable: state
            value_selector: [fetch, state]
          title: Failed fetch
          type: end
        id: failed-fetch
        position: {x: 1120, y: 560}
        type: custom
