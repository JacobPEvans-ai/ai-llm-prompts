name: ai-news
extends: local-batch
description: |
  Use when: configured AI news sources contain potentially relevant announcements.
  Do not use when: a model needs a catalog dossier or an upgrade needs execution.
triggers: [{kind: rotation, every: 1d}]
tools: [litellm.chat_completions, web_search, web_extract]
reader: donna-morning-brief
acted_signal: cited news item
identity: agent-ai-news
api_key_ref: openbao://agent-key/ai-news
input: Configured sources and interests, UTC time, source results, bookmarks and delivery ledger.
