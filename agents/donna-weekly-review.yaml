name: donna-weekly-review
extends: local-batch
description: |
  Use when: the operator needs a weekly review and proposed next moves.
  Do not use when: the request authorizes task changes or incident handling.
privacy_class: private
identity: agent-donna-weekly-review
api_key_ref: openbao://agent-key/donna-weekly-review
reader: operator
acted_signal: A proposed move is applied.
triggers: [{kind: anchor, at: '15:31', days: [Sun]}]
connectors: [vikunja-clerk]
tools: [a2a.call]
input: Approved weekly task history, supplied inbox and task-triage intake, operator preferences, UTC time, source availability and delivery state.
