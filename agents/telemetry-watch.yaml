name: telemetry-watch
owner: agent-platform
tier: 2
triggers:
  - {kind: schedule, source: dify, cadence: "7,37 * * * *", skew_minutes: 7}
  - {kind: event, source: alert-firing, cadence: on-event, skew_minutes: 0}
  - {kind: event, source: alert-severity-change, cadence: on-event, skew_minutes: 0}
  - {kind: event, source: alert-recovery, cadence: on-event, skew_minutes: 0}
  - {kind: call, source: authenticated-caller, cadence: on-demand, skew_minutes: 0}
home_platform: dify
shadows: [sim, langflow]
privacy_class: private
connectors: [splunk-clerk, slack-clerk, zammad-clerk, vikunja-clerk]
code_work: none
mode: shadow
prompt: agents/prompts/telemetry-watch.md
shared_prefix: agents/prompts/shared/homelab.md
procedure:
  - {repo: dryvist/claude-code-plugins, path: homelab-ops/skills/monitoring-first/SKILL.md}
tools: [a2a.send_message]
mcp_servers: []
litellm_role: telemetry-watch
memory_scope: telemetry-watch-ledger
eval_set: agents/evals/telemetry-watch.yaml
identity: agent-telemetry-watch
api_key_ref: openbao://agent-key/telemetry-watch
