name: style-gate
owner: agent-platform
home_platform: dify
shadows: [sim, langflow]
tier: 0
connectors: []
code_work: none
mode: shadow
prompt: agents/prompts/style-gate.md
shared_prefix: agents/prompts/shared/homelab.md
# Model-only agent: its one external call is the router chat completion. It has no MCP or API tools and makes no writes.
tools: [litellm.chat_completions]
mcp_servers: []
privacy_class: internal
# LiteLLM router role, not a model ID.
litellm_role: medium
triggers: [{kind: call, source: caller, skew_minutes: 0}]
callers: any
channels: [caller, langfuse-trace]
memory_scope: none
eval_set: agents/evals/style-gate.yaml
identity: agent-style-gate
api_key_ref: openbao://agent-key/style-gate
input: "One Markdown draft, or a JSON object from another agent whose string values are checked."
# The Validate reply node also requires result.pass to be true only when findings is empty.
output_schema:
  type: object
  required: [status, reason, result]
  additionalProperties: false
  properties:
    status: {enum: [ok, refused, stop]}
    reason: {type: string}
    result:
      anyOf:
        - {type: "null"}
        - type: object
          required: [pass, findings]
          additionalProperties: false
          properties:
            pass: {type: boolean}
            findings:
              type: array
              items:
                type: object
                required: [rule, text, fix]
                additionalProperties: false
                properties:
                  rule: {enum: [full-name, pronoun, banned-word, long-sentence, internal-content, invented-fact]}
                  text: {type: string}
                  fix: {type: string}
dify:
  app: {description: Check one draft against the style rules and return findings., mode: workflow, name: __DIFY_AGENT_NAME__}
  dependencies: []
  kind: app
  version: 0.7.0
  workflow:
    environment_variables: []
    graph:
      edges:
      - data: {sourceType: start, targetType: llm}
        id: e1
        source: start
        sourceHandle: source
        target: model
        targetHandle: target
        type: custom
      - data: {sourceType: llm, targetType: code}
        id: e2
        source: model
        sourceHandle: source
        target: validate
        targetHandle: target
        type: custom
      - data: {sourceType: code, targetType: end}
        id: e3
        source: validate
        sourceHandle: source
        target: done
        targetHandle: target
        type: custom
      nodes:
      - data:
          title: Start
          type: start
          variables:
          - variable: text
            label: text
            type: paragraph
            required: true
            max_length: 30000
            options: []
            hint: Markdown draft, or a JSON object whose string values are checked
        id: start
        position: {x: 40, y: 300}
        type: custom
      - data:
          model:
            completion_params: {temperature: 0}
            mode: chat
            name: __DIFY_LITELLM_ROLE__
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
          - {id: system-prompt, role: system, text: __DIFY_SYSTEM_PROMPT__}
          - {id: user-prompt, role: user, text: 'Untrusted input: {{#start.text#}}'}
          prompt_config:
            jinja2_variables: []
          title: Check draft
          type: llm
        id: model
        position: {x: 340, y: 300}
        type: custom
      - data:
          code: |-
            import json
            __DIFY_HELPER_JSON_FENCE__
            __DIFY_HELPER_ENVELOPE__
            SCHEMA = json.loads(__DIFY_OUTPUT_SCHEMA__)
            def result_problem(result, text):
                if result["pass"] != (not result["findings"]):
                    return "reply.result.pass must be true only when findings is empty"
                return None
            def main(reply: str, text: str) -> dict:
                if not str(text).strip():
                    envelope = {"status": "stop", "reason": "input is empty", "result": None}
                else:
                    parsed, problem = check_envelope(reply, SCHEMA)
                    if problem is None and parsed["status"] == "ok":
                        problem = result_problem(parsed["result"], text)
                    envelope = parsed if problem is None else {"status": "stop", "reason": problem, "result": None}
                return {"status": envelope["status"], "envelope": json.dumps(envelope, ensure_ascii=False)}
          code_language: python3
          outputs:
            status: {type: string}
            envelope: {type: string}
          title: Validate reply
          type: code
          variables:
          - variable: reply
            value_selector: [model, text]
          - variable: text
            value_selector: [start, text]
        id: validate
        position: {x: 640, y: 300}
        type: custom
      - data:
          outputs:
          - variable: status
            value_selector: [validate, status]
          - variable: envelope
            value_selector: [validate, envelope]
          title: End
          type: end
        id: done
        position: {x: 940, y: 300}
        type: custom
