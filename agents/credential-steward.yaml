name: credential-steward
extends: task-advisor
description: |
  Use when: authorized lifecycle metadata needs an advisory rotation review.
  Do not use when: a request requires secret values or credential changes.
  Typical triggers include rotation deadlines and managed lease reviews. See "When to invoke" in the agent prompt.
identity: agent-credential-steward
api_key_ref: openbao://agent-key/credential-steward
reader: credential owner
acted_signal: The owner schedules or resolves a rotation planning task.
triggers: [{kind: rotation, every: 1d}]
input: Supplied authorized lifecycle metadata, observation time, owner, and existing task receipts.
