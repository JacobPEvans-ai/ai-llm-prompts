name: ci-fixer
owner: agent-platform
home_platform: dify
# Credential model: per-agent LiteLLM key plus an AppRole that can mint only a
# short-lived GitHub App installation token for the event repo; Dify holds no
# PAT or App key.
prompt: agents/prompts/ci-fixer.md
shared_prefix: shared/homelab.md
tools:
  - github.checks.get_check_run
  - github.checks.list_annotations
  - github.actions.download_job_logs
  - github.pulls.get
  - github.pulls.diff
  - github.branches.get
  - github.repos.get_branch_rules
  - github.git.create_blob
  - github.git.create_tree
  - github.git.create_commit
  - github.git.update_ref
  - github.issues.create_comment
mcp_servers: []
privacy_class: public-code
# LiteLLM router role, not a model ID.
litellm_role: medium
trigger:
  kind: event
  event_filter:
    event: check_run
    action: completed
    conclusion: failure
    org: dryvist
memory_scope: none
eval_set: agents/evals/ci-fixer.yaml
identity: agent-ci-fixer
secret_ref: agent-key/ci-fixer
github_token_ref: github-token/ci-fixer
guards:
  github.git.create_blob:
    repository_source: trigger_payload
    head_ref_source: trigger_payload
    deny_if_payload_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_trigger_event_head_sha
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [trigger_event_repository_only]
      max_lifetime: 1h
  github.git.create_tree:
    repository_source: trigger_payload
    head_ref_source: trigger_payload
    deny_if_payload_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_trigger_event_head_sha
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [trigger_event_repository_only]
      max_lifetime: 1h
  github.git.create_commit:
    repository_source: trigger_payload
    head_ref_source: trigger_payload
    commit_parent_sha: trigger_event_head_sha
    deny_if_payload_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_trigger_event_head_sha
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [trigger_event_repository_only]
      max_lifetime: 1h
  github.git.update_ref:
    repository_source: trigger_payload
    head_ref_source: trigger_payload
    deny_if_payload_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_trigger_event_head_sha
    expected_old_ref_sha: must_equal_trigger_event_head_sha
    force: false
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [trigger_event_repository_only]
      max_lifetime: 1h
  github.issues.create_comment:
    repository_source: trigger_payload
    pull_request_number_source: trigger_payload
    pull_request: must_match_trigger_event_head_sha
    body: redact_secrets_and_never_include_raw_logs
    token_scope:
      permission: issues:write
      repositories: [trigger_event_repository_only]
      max_lifetime: 1h
