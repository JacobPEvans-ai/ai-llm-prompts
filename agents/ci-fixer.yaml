name: ci-fixer
extends: event-worker
description: |
  Use when: an eligible failed check needs a bounded code correction.
  Do not use when: the check succeeded or the request exceeds the code mandate.
connectors: [github-clerk]
tools:
  - github.checks.get_check_run
  - github.checks.list_annotations
  - github.actions.download_job_logs
  - github.pulls.get
  - github.pulls.diff
  - github.branches.get
  - github.repos.get_branch_rules
  - github.git.create_blob
  - github.git.create_tree
  - github.git.create_commit
  - github.git.update_ref
  - github.issues.create_comment
privacy_class: public
triggers:
  - kind: event
    source: github.check_run
    skew_minutes: 0
    event_filter:
      event: check_run
      action: completed
      conclusion: failure
      org: dryvist
mandate_binding:
  required_fields: [repo, ref, head_sha, strength]
  event: check_run
  push_strength: explicit
channels:
  live:
  - github.commit
  - github.comment
promotion:
  after_matching_shadow_runs: 30
  against: agents/evals/ci-fixer.yaml # TBD-master
identity: agent-ci-fixer
api_key_ref: agent-key/ci-fixer
secret_ref: agent-key/ci-fixer
github_token_ref: github-token/ci-fixer
guards:
  github.git.create_blob:
    bound_to:
      repo: mandate.repo
      ref: mandate.ref
      head_sha: mandate.head_sha
      strength: mandate.strength
    repository_source: mandate.repo
    head_ref_source: mandate.ref
    deny_if_mandate_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_mandate.head_sha
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [mandate_repo_only]
      max_lifetime: 1h
  github.git.create_tree:
    bound_to:
      repo: mandate.repo
      ref: mandate.ref
      head_sha: mandate.head_sha
      strength: mandate.strength
    repository_source: mandate.repo
    head_ref_source: mandate.ref
    deny_if_mandate_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_mandate.head_sha
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [mandate_repo_only]
      max_lifetime: 1h
  github.git.create_commit:
    bound_to:
      repo: mandate.repo
      ref: mandate.ref
      head_sha: mandate.head_sha
      strength: mandate.strength
    repository_source: mandate.repo
    head_ref_source: mandate.ref
    commit_parent_sha: mandate.head_sha
    deny_if_mandate_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_mandate.head_sha
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [mandate_repo_only]
      max_lifetime: 1h
  github.git.update_ref:
    bound_to:
      repo: mandate.repo
      ref: mandate.ref
      head_sha: mandate.head_sha
      strength: mandate.strength
    repository_source: mandate.repo
    head_ref_source: mandate.ref
    deny_if_mandate_value_missing_or_ambiguous: true
    protected_ref_check:
      api: github.repos.get_branch_rules
      before_write: true
      deny_refs: [main, develop]
      deny_protected_refs: true
      on_error: deny
    expected_head_sha: must_equal_mandate.head_sha
    expected_old_ref_sha: must_equal_mandate.head_sha
    force: false
    patch_limit:
      max_files: 3
      max_added_plus_removed_lines: 120
      enforce_before_any_git_data_write: true
    log_redaction: required_before_any_git_data_write
    if_log_redaction_unavailable: deny_git_data_writes_comment_only
    token_scope:
      permission: contents:write
      repositories: [mandate_repo_only]
      max_lifetime: 1h
  github.issues.create_comment:
    bound_to:
      repo: mandate.repo
      ref: mandate.ref
      head_sha: mandate.head_sha
    repository_source: mandate.repo
    pull_request_number_source: matching_pr_in_mandate.repo_ref_head_sha
    pull_request: must_match_mandate.head_sha
    body: redact_secrets_and_never_include_raw_logs
    token_scope:
      permission: issues:write
      repositories: [mandate_repo_only]
      max_lifetime: 1h
