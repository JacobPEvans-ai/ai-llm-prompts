            def main(repo: str, pr_number: int, ref: str, head_sha: str, pr_body: str, rules_body: str, enable_push: str, mode: str, target_body: str) -> dict:
                try:
                    pr, rules = json.loads(pr_body), json.loads(rules_body)
                    if not isinstance(rules, list):
