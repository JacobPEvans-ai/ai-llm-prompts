config:
  MD013:
    line_length: 160
    tables: true
    strict: true

ignores:
  - "flake.lock"
  # Generated by release-please on every release.
  - "CHANGELOG.md"
  # Runtime prompt bodies preserve source formatting and may intentionally use
  # repeated headings, template tags, or literal long lines. OKF frontmatter is
  # validated separately; ordinary repository and catalog index Markdown stays
  # under the canonical lint rules.
  - "auto-ai-agent/**/!(index).md"
  - "automation/**/!(index).md"
  - "applications/**/!(index).md"
  - "developer-tools/**/!(index).md"

overrides:
  - filter:
      - "agents/prompts/ci-fixer.md"
      - "agents/prompts/code-simplifier.md"
    config:
      MD025:
        # The OKF title is stripped from the prompt body; count only its actual H1.
        front_matter_title: "^\\s*markdown_title\\s*[:=]"
    combine: merge
